# Cluster-level bounds on student sandboxes. DRAFT, not yet applied. See ../README.md
#
# None of this comes from the OpenShell chart. These are the layers a student cannot
# widen from inside a sandbox, however permissive their own OpenShell policy is.
#
#   kubectl apply -f guardrails.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshell-sandboxes
  annotations:
    # Requires the PodNodeSelector admission plugin on the apiserver:
    #   --kube-apiserver-arg=enable-admission-plugins=PodNodeSelector
    # Without this (or an equivalent Kyverno mutation) sandbox pods can land on cirrus,
    # because the chart's nodeSelector applies to the gateway pod only.
    scheduler.alpha.kubernetes.io/node-selector: "role=sandbox"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
  namespace: openshell-sandboxes
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 64Gi
    limits.cpu: "32"
    limits.memory: 128Gi
    # Sandboxes get no GPU. Agents reach GPUs by submitting Jobs elsewhere (README
    # phase 7), so a GPU request inside the sandbox namespace is always a mistake.
    requests.nvidia.com/gpu: "0"
    persistentvolumeclaims: "20"
    requests.storage: 200Gi
    count/pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-defaults
  namespace: openshell-sandboxes
spec:
  limits:
    - type: Container
      default:        {cpu: "2",  memory: 4Gi}
      defaultRequest: {cpu: 250m, memory: 512Mi}
      max:            {cpu: "16", memory: 64Gi}
---
# OpenShell's in-sandbox proxy is the primary egress control. This is the backstop if
# that enforcement is bypassed, and the hard boundary against a student widening their
# own sandbox policy toward minio, rustfs, juicefs, vllm, llm-proxy, or arc-runners.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-egress-fence
  namespace: openshell-sandboxes
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: openshell}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16       # k3s pod CIDR
              - 10.43.0.0/16       # k3s service CIDR (includes the apiserver at
                                   # 10.43.0.1:443 -- see README phase 7 before
                                   # opening this for local Job submission)
              - 169.254.0.0/16     # link-local
              - 128.32.85.0/24     # campus LAN, includes cirrus itself and :6443
              - 172.16.0.0/12      # docker bridges on the host
              - 192.168.0.0/16
