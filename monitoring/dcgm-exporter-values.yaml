# dcgm-exporter -- per-GPU telemetry, one DaemonSet across the whole cluster
# (cirrus 2x RTX 8000, nimbus 1x GB10; thelio when it comes back).
#
# Must NOT request nvidia.com/gpu -- that resource is time-sliced for
# model-serving pods (see ../nvidia/nvidia-device-plugin-config.yaml), and a
# telemetry agent should not be holding a slice. GPU access comes from
# runtimeClassName instead, the same mechanism the vLLM manifests use.
runtimeClassName: nvidia

# No prometheus-operator CRDs installed in this cluster -- ServiceMonitor
# would fail to apply.
serviceMonitor:
  enabled: false

# Picked up by Prometheus's built-in kubernetes-pods scrape job
# (enabled by default in the prometheus-community/prometheus chart).
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9400"

# Every GPU node needs an entry here, and this is ONE list -- a second
# `tolerations:` key does not add to it, YAML takes the last and drops the rest.
#
# cirrus is the control plane. thelio is jupyter-only
# (hub.jupyter.org/dedicated=user:NoSchedule) and hosts GPU notebook pods on its
# RTX 2080. nimbus is a worker tainted `dedicated=nimbus:NoSchedule` (see
# ../k3s/nimbus-join/); GPU telemetry is one of the few things we *do* want
# there. Miss any one of them and that node's GPU utilisation never reaches
# Prometheus -- the dashboard silently covers part of the fleet and looks fine.
#
# Note on GB10: DCGM_FI_DEV_FB_FREE / _FB_USED and the memory-clock fields
# report N/A on unified memory. Expected, not a broken exporter.
# DCGM_FI_DEV_POWER_USAGE does work, which is what the carbon dashboard needs.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: hub.jupyter.org/dedicated
    operator: Equal
    value: user
    effect: NoSchedule
  - key: dedicated
    operator: Equal
    value: nimbus
    effect: NoSchedule
