# /etc/rancher/k3s/config.yaml  -- nimbus (DGX Spark GB10), k3s AGENT in the
# cirrus cluster.
#
# nimbus used to be its own single-node k3s *server*. It is now an agent
# (worker) of the cirrus control plane -- see ../join/README.md. Two
# consequences for this file:
#
#   * `write-kubeconfig-mode` is gone. It is a server-only flag; `k3s agent`
#     rejects unknown flags outright, so leaving it here makes the agent refuse
#     to start. An agent has no /etc/rancher/k3s/k3s.yaml to chmod anyway.
#   * `node-taint` is set at *registration*. This is the whole reason nimbus is
#     "sanctioned tasks only": the node comes up already tainted, so there is no
#     window in which cirrus's untainted workloads can land on it. Applying the
#     taint after the fact with `kubectl taint` would leave exactly such a gap.
#
# Node *labels* are deliberately NOT set here. k3s's NodeRestriction admission
# only lets a kubelet self-assign labels from a small allow-list, and
# `nvidia.com/device-plugin.config` is not on it. That label is applied from the
# cirrus side in ../join/03-post-join.sh, same as cirrus and thelio.
#
# The eviction thresholds below are layer 3 of the hardening described in
# ../README.md. The stock threshold is memory.available<100Mi,
# which on a 121 GiB unified-memory node means kubelet does nothing until the
# machine is already dead.
#
# NOTE: eviction is a backstop, not the primary control. Per services/vllm/dgx-spark-memory.md,
# cgroup limits do not constrain CUDA allocations on unified memory -- the real
# control is --kv-cache-memory-bytes in the vLLM manifest.

server: https://128.32.85.8:6443     # cirrus.local -- the control plane

# Pin the node IP. nimbus has docker0 and a (down) wlP9s9 besides the campus
# NIC; leaving this to autodetection is how a node ends up registering an
# unroutable address and flannel silently blackholing cross-node traffic.
node-ip: 128.32.85.239

# Sanctioned tasks only. Anything that is meant to run here carries the matching
# toleration *and* a `kubernetes.io/hostname: nimbus` nodeSelector:
#   services/vllm/qwen38-nimbus.yaml, services/mcp/deployment.yaml,
#   platform/monitoring/dcgm-exporter-values.yaml, platform/nvidia/nvidia-device-plugin-config.yaml.
#
# Nothing storage-related tolerates this taint on purpose. All persistent
# storage -- the `tank` zpool, OpenEBS ZFS-LocalPV, JuiceFS, RustFS -- lives on
# cirrus. nimbus is compute only; its one stateful need is the read-only
# hostPath HuggingFace cache at /home/cboettig/.cache/huggingface.
node-taint:
  - "dedicated=nimbus:NoSchedule"

kubelet-arg:
  # Reserve headroom for the OS and for k3s itself so the scheduler cannot
  # commit the entire pool to pods.
  - "system-reserved=cpu=1,memory=4Gi"
  - "kube-reserved=cpu=1,memory=2Gi"
  # Start evicting well before the driver has a chance to deadlock.
  - "eviction-hard=memory.available<6Gi,nodefs.available<10%"
  - "eviction-soft=memory.available<12Gi"
  - "eviction-soft-grace-period=memory.available=90s"
  - "eviction-max-pod-grace-period=30"
