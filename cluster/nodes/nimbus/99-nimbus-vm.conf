# /etc/sysctl.d/99-nimbus-vm.conf -- reclaim tuning for the GB10 unified pool.
#
# Rationale (see README.md, incident 2026-08-24): the box wedged without the OOM
# killer ever firing. Kernel defaults assume reclaimable memory and a machine far
# smaller than 121 GiB. Under a vLLM allocation storm the kernel blew past its
# watermarks between kswapd wakeups, fell into *direct* reclaim inside the page
# fault path, and deadlocked there while holding the NVIDIA driver's rw-semaphore.
#
# The goal of these three settings is simple: let kswapd reclaim in the
# background, early, so reclaim never has to happen synchronously inside a
# driver lock.

# Was 45167 (~44 MiB) -- a rounding error on a 121 GiB machine. 2 GiB gives the
# allocator a real reserve to draw on while kswapd catches up.
vm.min_free_kbytes = 2097152

# Was 10 (0.1%). This sets the gap between the low and high watermarks, i.e. how
# early kswapd wakes and how much it reclaims once awake. 200 (2%, ~2.4 GiB)
# means background reclaim starts while there is still plenty of runway, instead
# of at the cliff edge. Max permitted is 3000.
vm.watermark_scale_factor = 200

# Was 60. Most of what is reclaimable here is clean page cache -- notably the
# ~22 GiB duplicate of the model weights pulled in through the hostPath mount by
# --load-format fastsafetensors. Dropping that costs a re-read; swapping out
# anonymous pages of live pods costs a thrash. Prefer the former.
vm.swappiness = 10

# NOTE: vm.overcommit_memory is deliberately left at 1 (always overcommit).
# It is a contributing factor -- it defers allocation failure to fault time --
# but CUDA and PyTorch both expect it, and changing it is the kind of thing that
# breaks an unrelated workload three weeks later. Fix reclaim, not overcommit.
