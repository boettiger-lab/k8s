# Drop-in for apt-daily-upgrade.service (the nightly unattended-upgrades run).
# Installed by install-os-updates.sh to
#   /etc/systemd/system/apt-daily-upgrade.service.d/50-apt-metrics.conf
#
# Refresh the apt metrics the moment the run finishes, so a healthy node always
# records its post-run zero. With only the hourly timer, a security package
# published between the run and the next refresh meant the node NEVER showed a
# zero, and OsSecurityUpdatesNotApplying fired on a healthy node (nimbus,
# 2026-09-30). The leading "-" keeps a metrics failure from failing the run.
[Service]
ExecStartPost=-/usr/local/bin/apt-metrics.sh
