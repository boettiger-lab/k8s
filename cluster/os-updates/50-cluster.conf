# Cluster needrestart policy. Installed to /etc/needrestart/conf.d/ by
# install-os-updates.sh.
#
# A library security update (openssl, libc) does nothing for a daemon that
# still has the old copy mapped, so restart affected services automatically.
# Container workloads are unaffected either way -- they carry their own libs.
$nrconf{restart} = 'a';

# Never let a package upgrade bounce the node agent. k3s is restarted only by
# system-upgrade-controller (cluster/upgrade/plans.yml) or a planned reboot;
# restarting it on cirrus restarts the only control plane. It is a static Go
# binary, so it should never be flagged anyway -- this makes sure.
$nrconf{override_rc}{qr(^k3s)} = 0;
$nrconf{override_rc}{qr(^containerd)} = 0;
$nrconf{override_rc}{qr(^nvidia)} = 0;
