name: Armada Scheduler Image

# Builds the patched Armada scheduler (services/armada/scheduler-image) and pushes it to ghcr. amd64 only,
# like upstream's scheduler image. The tag names the Armada version, the patch and a rebuild REVISION; bump
# ARMADA_VERSION in the Dockerfile and here together, and check that the patch still applies.
#
# Bump REVISION on every rebuild and set the same tag in services/armada/armada-scheduler.yaml. The
# deployment pulls IfNotPresent (the operator CRD cannot pin by digest), so pushing over an existing tag
# never reaches the node.
on:
  workflow_dispatch: null
  push:
    branches: [main]
    paths:
      - 'services/armada/scheduler-image/**'
      - '.github/workflows/armada-scheduler-image.yml'

env:
  IMAGE: ghcr.io/boettiger-lab/armada-scheduler
  ARMADA_VERSION: 0.22.16
  REVISION: '2'   # the first build was tagged plain 0.22.16-nonarmada

concurrency:
  group: armada-scheduler-image
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'boettiger-lab/k8s'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: services/armada/scheduler-image
          platforms: linux/amd64
          build-args: ARMADA_VERSION=${{ env.ARMADA_VERSION }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.ARMADA_VERSION }}-nonarmada.${{ env.REVISION }}
          provenance: false
          sbom: false

      - name: Digest
        run: |
          echo "digest: ${{ steps.build.outputs.digest }}"
          echo "Pushed \`${IMAGE}:${ARMADA_VERSION}-nonarmada.${REVISION}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
