name: speaches Image

# Builds services/vllm/speaches-image: upstream speaches 0.9.0-rc.3 with its vulnerable
# Python deps and Ubuntu packages patched (#242), and pushes it to ghcr. amd64 only: it
# runs on cirrus's RTX 8000s.
#
# Pull requests build the image (running the Dockerfile's pip check gate) without
# pushing; only main publishes. Bump REVISION on every rebuild, then pin the new digest
# in services/vllm/stt-cirrus.yaml (both the init container and the server).
on:
  workflow_dispatch: null
  push:
    branches: [main]
    paths:
      - 'services/vllm/speaches-image/**'
      - '.github/workflows/speaches-image.yml'
  pull_request:
    paths:
      - 'services/vllm/speaches-image/**'
      - '.github/workflows/speaches-image.yml'

env:
  IMAGE: ghcr.io/boettiger-lab/speaches
  UPSTREAM: 0.9.0-rc.3-cuda-12.6.3
  REVISION: '1'

concurrency:
  group: speaches-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'boettiger-lab/k8s'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push from main)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/vllm/speaches-image
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ env.UPSTREAM }}-patch.${{ env.REVISION }}
          provenance: false
          sbom: false

      - name: Digest to pin
        if: env.PUBLISH == 'true'
        run: |
          echo "digest: ${{ steps.build.outputs.digest }}"
          echo "Pin in \`services/vllm/stt-cirrus.yaml\`: \`${IMAGE}:${UPSTREAM}-patch.${REVISION}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
