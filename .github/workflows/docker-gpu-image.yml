name: GPU Image
on:
  workflow_dispatch: null
  schedule:
    - cron: '0 0 * * 0'
  push:
    # main only: the merge job tags :latest, and the hub pulls :latest with
    # pullPolicy Always, so a branch push would ship unreviewed images.
    branches: [main]
    # Trigger on the files the GPU Dockerfile actually consumes. The previous
    # list referenced spatial-env.yml / jupyter-ai.yml / install.r (which don't
    # exist) and omitted the install-*.sh scripts the Dockerfile now COPYs and
    # runs, so script edits would silently never rebuild the image.
    paths:
      - 'images/Dockerfile.gpu'
      - 'images/install-claude.sh'
      - 'images/install-jupyter-ai.sh'
      - 'images/install-themes.sh'
      - 'images/install-armada.sh'
      - 'images/armada-dex-token'
      - 'images/armada-config-merge'
      - '.github/workflows/docker-gpu-image.yml'

# Build each architecture on its own native runner (arm64 on ubuntu-24.04-arm,
# no QEMU), push by digest, then assemble one multi-arch manifest. Native
# per-arch builds are much faster than emulating arm64, and each runner only
# materializes one arch filesystem -- halving the disk pressure that the large
# no-cache CUDA+torch image puts on a stock ~14G runner.
env:
  IMAGE: ghcr.io/boettiger-lab/k8s-gpu

jobs:
  build:
    if: github.repository == 'boettiger-lab/k8s'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm   # native arm64 runner, no QEMU
    steps:
      - name: Prepare platform name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      # Inline instead of jlumbroso/free-disk-space@main: a third-party action
      # on a moving branch should not run in a job that pushes images. Same
      # deletions that action made with the inputs we used (android, dotnet,
      # haskell, tool cache; no apt removals, docker images or swap).
      - name: cleanup disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/
          file: images/Dockerfile.gpu
          platforms: ${{ matrix.platform }}
          no-cache: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.repository == 'boettiger-lab/k8s'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:latest"
