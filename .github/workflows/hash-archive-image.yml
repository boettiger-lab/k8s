name: hash-archive Image CI

# Builds ghcr.io/boettiger-lab/hash-archive from services/hash-archive/Dockerfile.
#
# WHY THIS EXISTS: the image this replaces (cboettig/hash-archive:latest,
# Ubuntu 16.04, built 2020) existed ONLY in cirrus's local Docker daemon and was
# never pushed anywhere. Any `docker system prune -a` would have destroyed the
# only copy. This workflow makes the image reproducible.
#
# Upstream (btrask/hash-archive) is a third-party repo we do not control, so
# there is a weekly schedule to pick up upstream changes and rebuild against
# current base-image security updates — but HASH_ARCHIVE_REF pins what is built.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream git ref to build (branch, tag or commit SHA)'
        required: false
        default: 'master'
  schedule:
    - cron: '0 0 * * 0'
  push:
    paths:
      - 'services/hash-archive/Dockerfile'
      - 'services/hash-archive/patches/**'
      - '.github/workflows/hash-archive-image.yml'

env:
  IMAGE: ghcr.io/boettiger-lab/hash-archive
  # Compiled into src/config.h. hash-archive answers 403 to any request whose
  # Host header does not match, so this must equal the public hostname served
  # by services/hash-archive/ingress.yaml.
  HOSTNAME_CONFIG: hash-archive.carlboettiger.info

jobs:
  build:
    if: github.repository == 'boettiger-lab/k8s'
    runs-on: ${{ matrix.runner }}
    permissions: write-all
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm   # native arm64 runner, no QEMU
    steps:
      - name: Prepare platform name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: services/hash-archive/
          platforms: ${{ matrix.platform }}
          build-args: |
            HASH_ARCHIVE_REF=${{ github.event.inputs.ref || 'master' }}
            HOSTNAME_CONFIG=${{ env.HOSTNAME_CONFIG }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.repository == 'boettiger-lab/k8s'
    runs-on: ubuntu-latest
    needs: build
    permissions: write-all
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:latest"
