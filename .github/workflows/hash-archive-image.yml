name: hash-archive Image CI

# Builds ghcr.io/boettiger-lab/hash-archive from services/hash-archive/Dockerfile.
#
# WHY THIS EXISTS: the image this replaces (cboettig/hash-archive:latest,
# Ubuntu 16.04, built 2020) existed ONLY in cirrus's local Docker daemon and was
# never pushed anywhere. Any `docker system prune -a` would have destroyed the
# only copy. This workflow makes the image reproducible.
#
# Upstream (btrask/hash-archive) is a third-party repo we do not control, so
# there is a weekly schedule to pick up upstream changes and rebuild against
# current base-image security updates — but HASH_ARCHIVE_REF pins what is built.
#
# Pull requests that touch the image build it for both arches WITHOUT pushing,
# so Dockerfile changes are tested before they can reach :latest.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream git ref to build (branch, tag or commit SHA)'
        required: false
        default: '5133e6a6ed35b3977a733835646f20370cff2de3'
  schedule:
    - cron: '0 0 * * 0'
  push:
    # main only: the merge job tags :latest, so a branch push would ship an
    # unreviewed image.
    branches: [main]
    paths:
      - 'services/hash-archive/Dockerfile'
      - 'services/hash-archive/patches/**'
      - '.github/workflows/hash-archive-image.yml'
  pull_request:
    paths:
      - 'services/hash-archive/Dockerfile'
      - 'services/hash-archive/patches/**'
      - '.github/workflows/hash-archive-image.yml'

env:
  IMAGE: ghcr.io/boettiger-lab/hash-archive
  # Compiled into src/config.h. hash-archive answers 403 to any request whose
  # Host header does not match, so this must equal the public hostname served
  # by services/hash-archive/ingress.yaml.
  HOSTNAME_CONFIG: hash-archive.carlboettiger.info
  # Upstream commit to build unless a manual dispatch names another ref.
  # Keep in step with the HASH_ARCHIVE_REF default in the Dockerfile.
  HASH_ARCHIVE_REF: 5133e6a6ed35b3977a733835646f20370cff2de3
  # Only real runs on main publish; PR runs just build.
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    if: github.repository == 'boettiger-lab/k8s'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm   # native arm64 runner, no QEMU
    steps:
      - name: Prepare platform name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/hash-archive/
          platforms: ${{ matrix.platform }}
          build-args: |
            HASH_ARCHIVE_REF=${{ github.event.inputs.ref || env.HASH_ARCHIVE_REF }}
            HOSTNAME_CONFIG=${{ env.HOSTNAME_CONFIG }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.repository == 'boettiger-lab/k8s' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:latest"
