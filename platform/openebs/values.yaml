# zfs-localpv chart overrides.
#
# Sidecar tags: chart 2.11.2 still ships the 2024-25 kubernetes-csi sidecars, which
# trivy flags critical (grpc < 1.79.3, old Go stdlib). These are the 2026-11-23
# patch releases (Go 1.26, grpc >= 1.83). Recheck when bumping the chart: drop an
# override once the chart's default tag catches up.
#
# csi-resizer v2 runs a VolumeAttributesClass informer and needs RBAC the chart
# lacks: resizer-vac-rbac.yaml. Apply it before this.
zfsNode:
  driverRegistrar:
    image:
      tag: v2.18.1
zfsController:
  resizer:
    image:
      tag: v2.3.1
  snapshotter:
    image:
      tag: v8.7.1
  snapshotController:
    image:
      tag: v8.7.1
  provisioner:
    image:
      tag: v6.4.1
