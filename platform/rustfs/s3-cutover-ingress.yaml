# Applied AT THE CUTOVER ONLY (plan step 6), together with deleting MinIO's
# `minio-ingress` and `data-ingress` in namespace `minio`. Before then these hosts
# belong to MinIO, and two Ingresses claiming one host would split its traffic.
#
#   kubectl -n minio delete ingress minio-ingress data-ingress
#   kubectl apply -f platform/rustfs/s3-cutover-ingress.yaml
#
# `minio.` is an ALIAS of `s3.` (same Service), not a redirect: SigV4 signs the Host
# header and S3 clients don't follow redirects on signed requests. It keeps every
# NRP job, app and published link working. Its proxy setting matches today's record
# (DNS-only: it resolves straight to cirrus).
#
# The alias has its own Service (same pods as rustfs-s3) only so that Traefik
# counts its traffic separately. The access log keeps 4xx/5xx only, so quiet
# successful clients show up only in this metric:
#   sum by (code) (increase(traefik_service_requests_total{service="rustfs-minio-alias-api@kubernetes"}[7d]))
# Retire the alias when that stays at zero.
---
apiVersion: v1
kind: Service
metadata:
  name: minio-alias
  namespace: rustfs
spec:
  selector:
    app: rustfs-s3
  ports:
    - name: api
      port: 9000
      targetPort: 9000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-alias
  namespace: rustfs
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [minio.carlboettiger.info]
      secretName: minio-alias-tls
  rules:
    - host: minio.carlboettiger.info
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: minio-alias, port: {name: api}}}
---
# data.: the web console (same role as MinIO's console). Proxied, as today.
# RustFS serves its console under /rustfs/console/ and answers 403 at /, so the bare
# host (old MinIO-console bookmarks, the docs) is redirected there; other paths pass.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: data-console-root
  namespace: rustfs
spec:
  redirectRegex:
    regex: ^https?://data\.carlboettiger\.info/?$
    replacement: https://data.carlboettiger.info/rustfs/console/
    permanent: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: data
  namespace: rustfs
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    traefik.ingress.kubernetes.io/router.middlewares: rustfs-data-console-root@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [data.carlboettiger.info]
      secretName: data-console-tls
  rules:
    - host: data.carlboettiger.info
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: rustfs-s3, port: {name: console}}}
