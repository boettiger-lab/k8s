# Opens rustfs-s3's FTPS front end (s3.yaml) to the internet on cirrus.
# Temporary by design: apply while a partner is uploading, delete when done.
#   kubectl apply  -f platform/rustfs/ftps-public.yaml    # open
#   kubectl delete -f platform/rustfs/ftps-public.yaml    # close
# Deleting this Service closes the ports; FTPS keeps listening inside the cluster.
#
# Partners connect to s3.carlboettiger.info, port 21, "FTP over explicit TLS"
# (FileZilla "Require explicit FTP over TLS"), passive mode, with a RustFS user
# from guest-upload.sh. Plain FTP is refused by the server.
#
# k3s servicelb publishes each port on cirrus (128.32.85.8). FTP passive mode
# needs every data port exposed with the SAME number end to end, so the range
# below must match RUSTFS_FTPS_PASSIVE_PORTS (40000-40019) in s3.yaml: 20 ports
# = 20 concurrent transfers across all sessions. No host firewall on cirrus.
apiVersion: v1
kind: Service
metadata:
  name: rustfs-ftps
  namespace: rustfs
  labels: {app: rustfs-s3}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local    # keep client IPs (RustFS logs, aws:SourceIp)
  selector: {app: rustfs-s3}
  ports:
    - {name: ftps, port: 21, targetPort: 8022}
    - {name: pasv-0, port: 40000, targetPort: 40000}
    - {name: pasv-1, port: 40001, targetPort: 40001}
    - {name: pasv-2, port: 40002, targetPort: 40002}
    - {name: pasv-3, port: 40003, targetPort: 40003}
    - {name: pasv-4, port: 40004, targetPort: 40004}
    - {name: pasv-5, port: 40005, targetPort: 40005}
    - {name: pasv-6, port: 40006, targetPort: 40006}
    - {name: pasv-7, port: 40007, targetPort: 40007}
    - {name: pasv-8, port: 40008, targetPort: 40008}
    - {name: pasv-9, port: 40009, targetPort: 40009}
    - {name: pasv-10, port: 40010, targetPort: 40010}
    - {name: pasv-11, port: 40011, targetPort: 40011}
    - {name: pasv-12, port: 40012, targetPort: 40012}
    - {name: pasv-13, port: 40013, targetPort: 40013}
    - {name: pasv-14, port: 40014, targetPort: 40014}
    - {name: pasv-15, port: 40015, targetPort: 40015}
    - {name: pasv-16, port: 40016, targetPort: 40016}
    - {name: pasv-17, port: 40017, targetPort: 40017}
    - {name: pasv-18, port: 40018, targetPort: 40018}
    - {name: pasv-19, port: 40019, targetPort: 40019}
