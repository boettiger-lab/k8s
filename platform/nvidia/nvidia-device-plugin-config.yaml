runtimeClassName: nvidia

gfd:
  enabled: true

# Per-node config, selected by the `nvidia.com/device-plugin.config` node label.
#
#   cirrus (2x RTX 8000, 48GB) -> label "timeslice": time-slicing, 8 replicas/GPU
#       => 16 nvidia.com/gpu "slices" total. Time-slicing does NOT partition VRAM:
#          a slice is just a bookkeeping slot that caps how many pods share a GPU.
#          Every pod sees the FULL 48GB of whatever physical GPU it lands on.
#          - LLM serving (vLLM) claims slice(s) and uses the whole card.
#          - Light GPU notebooks / RL work claim 1 slice each.
#          A pod may claim MULTIPLE slices (failRequestsGreaterThanOne is left at
#          its default false) -- e.g. an LLM can claim several to crowd notebooks
#          off its GPU, since the count is just a co-tenancy cap, not a memory cap.
#   thelio (RTX 2080, 8GB)     -> label "no-sharing": 1 whole GPU per pod. 8GB split
#          eight ways is ~1GB a pod with no isolation -- worse than useless. It
#          advertised 8 slices until 2026-09-07 only because the node was unlabelled
#          and fell through to config.default. Revisit if it ever receives one of
#          cirrus's 48GB RTX 8000s.
#   nimbus (1x GB10, DGX Spark) -> label "timeslice": 8 slices of the ONE GB10.
#          Same map entry as cirrus, but read it differently: those 8 slices are
#          shares of a single chip, not 8 GPUs, and the "VRAM" they share is the
#          host's 121 GiB UNIFIED pool -- the same memory the OS, k3s and every
#          other pod on the node are using. A slice count therefore bounds
#          nothing at all here; the only effective control on a model's footprint
#          is --kv-cache-memory-bytes in the vLLM manifest. See
#          ../../services/vllm/dgx-spark-memory.md and ../../cluster/nodes/nimbus/.
#
# NOTE: no MPS here, so there is no per-slice VRAM cap and no MPS control daemon
# (and thus none of the MPS config-manager sidecar trouble). If hard VRAM caps are
# ever needed, MPS is the only option but it cannot be limited to a single GPU
# (the plugin ignores `devices`/`rename` for mps), so it would slice all GPUs.
#
# Apply labels:
#   kubectl label node cirrus nvidia.com/device-plugin.config=timeslice  --overwrite
#   kubectl label node nimbus nvidia.com/device-plugin.config=timeslice  --overwrite
#   kubectl label node thelio nvidia.com/device-plugin.config=no-sharing --overwrite
#   kubectl label node nimbus nvidia.com/device-plugin.config=timeslice  --overwrite
#
# The labels are applied with kubectl rather than via k3s `--node-label`, because
# NodeRestriction only lets a kubelet self-assign labels from a short allow-list
# and `nvidia.com/*` is not on it.
#
# Label every GPU node explicitly: an unlabelled node silently inherits
# `config.default` below, which is rarely right for a small card. Check with
#   kubectl get nodes -L nvidia.com/device-plugin.config,nvidia.com/gpu.replicas
# Switching a node's mode also renames its product label (a `-SHARED` suffix appears
# or disappears), so any nodeSelector pinning nvidia.com/gpu.product must match.

# Both tainted nodes need an entry here, and there is only ONE top-level
# `tolerations:` key -- this is a single list, not one block per node. A second
# `tolerations:` key elsewhere in the file does not add to this one; YAML takes
# the last and silently drops the first.
#
# nimbus is a worker tainted `dedicated=nimbus:NoSchedule` (see
# ../../cluster/nodes/nimbus/join/). thelio carries `hub.jupyter.org/dedicated=user:NoSchedule`
# so it hosts jupyter user pods and nothing else. Without a matching toleration
# the plugin never runs on that node, it advertises zero nvidia.com/gpu, and
# every GPU pod pinned to it sits Pending forever with no obvious cause -- on
# thelio that means GPU notebook profiles silently cannot use its RTX 2080.
#
# This list REPLACES the chart's defaults rather than adding to them, so the
# defaults are restated. Dropping CriticalAddonsOnly or the nvidia.com/gpu
# NoSchedule toleration would break GPU scheduling on any node with those taints.
#
# HISTORY, so nobody removes this again on the same bad reasoning: this
# toleration was withdrawn on 2026-08-26 after a single
#   NVRM: Xid (PCI:0000:0a:00): 79, GPU has fallen off the bus.
# was read as a dying card. It was not. thelio's boot hangs were caused by
# /etc/default/grub.d/99-freeze-capture.cfg, whose memmap/ramoops reservation
# wedged the kernel early; recovery entries are built from GRUB_CMDLINE_LINUX
# rather than GRUB_CMDLINE_LINUX_DEFAULT, which is the only reason they escaped
# it. With the drop-in gone the machine runs a clean standard boot (49h+ uptime,
# no nomodeset). The GPU is healthy: link back at x16, zero Xid since, microcode
# applied. The Xid and an observed x8 link were a latched state that cleared
# only once power was fully removed.
tolerations:
- key: CriticalAddonsOnly
  operator: Exists
- key: nvidia.com/gpu
  operator: Exists
  effect: NoSchedule
- key: dedicated
  operator: Equal
  value: nimbus
  effect: NoSchedule
- key: hub.jupyter.org/dedicated
  operator: Equal
  value: user
  effect: NoSchedule

# node-feature-discovery ships as a subchart with its own tolerations, so the
# worker DaemonSet needs the same list, for the same reason.
nfd:
  worker:
    tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: dedicated
      operator: Equal
      value: nimbus
      effect: NoSchedule
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: user
      effect: NoSchedule

config:
  default: "timeslice"
  map:
    timeslice: |
      version: v1
      flags:
        migStrategy: "none"
        failOnInitError: true
        nvidiaDriverRoot: "/"
        plugin:
          passDeviceSpecs: false
          deviceListStrategy: "envvar"
          deviceIDStrategy: "uuid"
      sharing:
        timeSlicing:
          resources:
            - name: nvidia.com/gpu
              replicas: 8
    no-sharing: |
      version: v1
      flags:
        migStrategy: "none"
        failOnInitError: true
        nvidiaDriverRoot: "/"
        plugin:
          passDeviceSpecs: false
          deviceListStrategy: "envvar"
          deviceIDStrategy: "uuid"
