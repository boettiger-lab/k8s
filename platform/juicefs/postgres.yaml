# Dedicated PostgreSQL for JuiceFS metadata (the file index IS the filesystem —
# losing it orphans all home data). NOT armada's Postgres. Backed by cirrus/tank.
#
# This is a minimal single-instance deployment. BEFORE relying on it for real
# home data, add durability: scheduled pg_dump and/or WAL archiving (see README).
#
# Secret `juicefs-pg` (key: password) must exist first — see credentials.example.yaml.
#
# Apply with `kubectl apply -f juicefs/postgres.yaml`.
---
apiVersion: v1
kind: Namespace
metadata:
  name: juicefs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: juicefs-pg-data
  namespace: juicefs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-zfs   # cirrus tank
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juicefs-pg
  namespace: juicefs
  labels:
    app: juicefs-pg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juicefs-pg
  strategy:
    type: Recreate          # single node-local PVC; never run two pods on it
  template:
    metadata:
      labels:
        app: juicefs-pg
    spec:
      nodeSelector:
        kubernetes.io/hostname: cirrus
      containers:
        - name: postgres
          image: postgres:16
          # max_connections: 200, up from the postgres default of 100.
          #
          # On 2026-08-26 the JuiceFS CSI provisioner deadlocked against the
          # default: 12 stuck delete-volume jobs each opened ~8 metadata
          # connections on every respawn, saturated the 100 slots, and then
          # could not complete -- so the controller recreated them, consuming
          # more. Every client, including a plain `juicefs mount`, failed with
          #   FATAL: sorry, too many clients already (SQLSTATE 53300)
          # The loop could only be broken by scaling the controller to zero.
          #
          # 200 leaves headroom for a burst of concurrent mount/delvol jobs
          # without letting a runaway loop take the filesystem index offline.
          # The memory limit below is raised in step: Postgres reserves
          # per-connection memory, so lifting the ceiling without it just moves
          # the failure from connection exhaustion to an OOM kill.
          args: ["-c", "max_connections=200"]
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: juicefs
            - name: POSTGRES_DB
              value: juicefs
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: juicefs-pg
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              # 3Gi, raised alongside max_connections=200 above.
              memory: "3Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: juicefs-pg-data
---
apiVersion: v1
kind: Service
metadata:
  name: juicefs-pg
  namespace: juicefs
  labels:
    app: juicefs-pg
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: juicefs-pg
  type: ClusterIP
