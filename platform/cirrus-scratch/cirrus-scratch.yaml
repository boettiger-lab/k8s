# cirrus-scratch: per-pod scratch space on cirrus's dedicated scratch disk (/scratch).
#
# A second local-path-provisioner instance, separate from the one bundled with K3s:
# K3s owns kube-system/local-path-config and rewrites it, so this instance has its
# own namespace, provisioner name, RBAC and config. Based on upstream
# deploy/local-path-storage.yaml at v0.0.37 (the version K3s runs).
#
# Use it as a generic ephemeral volume, so the space is created with the pod and
# deleted with it:
#
#   volumes:
#     - name: scratch
#       ephemeral:
#         volumeClaimTemplate:
#           spec:
#             accessModes: [ReadWriteOnce]
#             storageClassName: cirrus-scratch
#             resources: {requests: {storage: 1Ti}}   # nominal; local-path enforces no size
#
# See README.md for what the disk is and is not for.
apiVersion: v1
kind: Namespace
metadata:
  name: cirrus-scratch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cirrus-scratch-provisioner
  namespace: cirrus-scratch
---
# Helper pods (mkdir / rm -rf of each volume's directory) run in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cirrus-scratch-provisioner
  namespace: cirrus-scratch
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cirrus-scratch-provisioner
  namespace: cirrus-scratch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cirrus-scratch-provisioner
subjects:
  - kind: ServiceAccount
    name: cirrus-scratch-provisioner
    namespace: cirrus-scratch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cirrus-scratch-provisioner
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cirrus-scratch-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cirrus-scratch-provisioner
subjects:
  - kind: ServiceAccount
    name: cirrus-scratch-provisioner
    namespace: cirrus-scratch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cirrus-scratch-provisioner
  namespace: cirrus-scratch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cirrus-scratch-provisioner
  template:
    metadata:
      labels:
        app: cirrus-scratch-provisioner
    spec:
      serviceAccountName: cirrus-scratch-provisioner
      # Lives on the node whose disk it serves.
      nodeSelector:
        kubernetes.io/hostname: cirrus
      containers:
        - name: provisioner
          image: docker.io/rancher/local-path-provisioner:v0.0.37
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - start
            - --config
            - /etc/config/config.json
            - --provisioner-name
            - cirrus-scratch.local-path
            - --configmap-name
            - cirrus-scratch-config
            - --service-account-name
            - cirrus-scratch-provisioner
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet: {path: /health, port: health}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /health, port: health}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: health}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
            - name: HEALTH_PORT
              value: "8080"
      volumes:
        - name: config-volume
          configMap:
            name: cirrus-scratch-config
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cirrus-scratch
provisioner: cirrus-scratch.local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
# The scheduler only places a pod that uses this class on cirrus.
allowedTopologies:
  - matchLabelExpressions:
      - key: kubernetes.io/hostname
        values: [cirrus]
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: cirrus-scratch-config
  namespace: cirrus-scratch
data:
  # cirrus only, with no DEFAULT_PATH_FOR_NON_LISTED_NODES entry: a claim on any
  # other node fails rather than landing on that node's root disk.
  config.json: |-
    {
      "nodePathMap": [
        {"node": "cirrus", "paths": ["/scratch"]}
      ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
      - name: helper-pod
        image: docker.io/library/busybox:1.37
        imagePullPolicy: IfNotPresent
