# Pin the k3s-bundled Traefik ingress controller to cirrus.
#
# k3s installs Traefik via a managed HelmChart ("traefik" in kube-system).
# A HelmChartConfig with the SAME name/namespace lets us override its values
# without forking the chart; k3s's helm-controller merges this in.
#
# WHY pin to cirrus: Traefik is the TLS-terminating hop for the S3 endpoint
# (minio.carlboettiger.info). MinIO and the JupyterHub user pods live on cirrus,
# so Traefik must be on cirrus too — otherwise S3 traffic crosses the 1Gb wire
# (user pod -> Traefik on thelio -> MinIO on cirrus = two VXLAN hops, ~0.94Gb/s
# cap). With everything co-located on cirrus the path stays on-node (~3Gb/s).
#
# Without this pin, the scheduler is free to move Traefik to any untainted
# node. This makes the placement an explicit, durable invariant. The other half of it is the
# system-upgrade server-plan's `cordon: false` (../../cluster/upgrade/plans.yml).
#
# Consequence: every ingress hostname, including the GB10 vLLM endpoints,
# resolves to cirrus and hairpins over the LAN to the serving node. That is
# the accepted price of one ingress/cert/DNS path, and it makes cirrus a hard
# dependency for every endpoint.
#
# CoreDNS, by contrast, is deliberately left floating: DNS is not
# bandwidth-bound, so its placement does not affect throughput, and it is a
# k3s-managed addon, which makes pinning it awkward.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    nodeSelector:
      kubernetes.io/hostname: cirrus

    # --- Hardening ---
    # Every ingress has TLS and certs come via DNS-01 (no HTTP-01 solver), so
    # :80 has no legitimate plaintext use. Redirect it at the entrypoint so no
    # bearer token / basicAuth / login cookie ever crosses the wire in cleartext.
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        http:
          middlewares:
            - kube-system-security-headers@kubernetescrd

    # Reject TLS handshakes for unknown SNI instead of serving the
    # "TRAEFIK DEFAULT CERT" + 404.
    tlsOptions:
      default:
        sniStrict: true

    # Error-only access log. Headers are dropped by default (no Authorization);
    # query params are dropped too, since some apps take ?token=.
    accessLog:
      enabled: true
      format: json
      filters:
        statusCodes: "400-599"
      fields:
        queryParameters:
          defaultMode: drop

    # HSTS + nosniff on every websecure route. No frameDeny: some of our apps
    # embed each other.
    extraObjects:
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: security-headers
          namespace: kube-system
        spec:
          headers:
            stsSeconds: 31536000
            stsIncludeSubdomains: true
            contentTypeNosniff: true
