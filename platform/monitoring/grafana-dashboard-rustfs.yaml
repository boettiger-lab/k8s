# Object store dashboard (as-code), auto-loaded by the Grafana sidecar.
# rustfs-s3 PUSHES its metrics to Prometheus over OTLP (RustFS has no /metrics
# to scrape; see ../rustfs/s3.yaml), so every series here carries
# job="rustfs-s3" from RUSTFS_OBS_SERVICE_NAME and instance = the pod IP, which
# changes on restart -- hence sum() everywhere. Pod memory/CPU come from cAdvisor.
# RustFS's own dashboards (.docker/observability in its repo) assume its
# OpenTelemetry collector's labels and are not used.
# Latency is a MEAN: 1.0.5's request-duration histogram uses OTel's default
# millisecond bucket bounds for values recorded in seconds, so every request
# lands in the first bucket and quantiles are meaningless.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-rustfs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Storage"
data:
  rustfs.json: |
    {
      "uid": "rustfs-s3",
      "title": "Object store (rustfs-s3)",
      "tags": [
        "storage",
        "s3",
        "rustfs"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Stored",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rustfs_cluster_usage_objects_total_bytes{job=\"rustfs-s3\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Objects",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rustfs_cluster_usage_objects_count{job=\"rustfs-s3\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Buckets",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rustfs_cluster_usage_objects_buckets_count{job=\"rustfs-s3\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Free in pool",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rustfs_cluster_capacity_free_bytes{job=\"rustfs-s3\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none"
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requests/s by method",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (method) (rate(rustfs_http_server_requests_total{job=\"rustfs-s3\"}[5m]))",
              "legendFormat": "{{method}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Failed requests/s (4xx includes normal anonymous 403/404s)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status_class) (rate(rustfs_http_server_failures_total{job=\"rustfs-s3\"}[5m]))",
              "legendFormat": "{{status_class}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Average request latency",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(rustfs_http_server_request_duration_seconds_sum{job=\"rustfs-s3\"}[5m])) / sum(rate(rustfs_http_server_request_duration_seconds_count{job=\"rustfs-s3\"}[5m]))",
              "legendFormat": "mean"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          },
          "description": "Mean, not percentiles: RustFS 1.0.5 records this histogram in seconds against OpenTelemetry's default millisecond bucket bounds (5, 10, 25 ... 10000), so nearly every request falls in the first bucket and histogram_quantile() is meaningless."
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Throughput",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(rustfs_http_server_response_body_bytes_total{job=\"rustfs-s3\"}[5m]))",
              "legendFormat": "out (to clients)"
            },
            {
              "refId": "B",
              "expr": "sum(rate(rustfs_http_server_request_body_bytes_total{job=\"rustfs-s3\"}[5m]))",
              "legendFormat": "in (uploads)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Top S3 calls/s",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(10, sum by (name) (rate(rustfs_api_requests_total{job=\"rustfs-s3\"}[5m])))",
              "legendFormat": "{{name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "In-flight requests",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rustfs_http_server_active_requests{job=\"rustfs-s3\"})",
              "legendFormat": "in flight"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Pod memory (limit 16 GiB)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 28
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"rustfs\",pod=~\"rustfs-s3-.*\",container!=\"\"})",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Pod CPU (cores, limit 4)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 28
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"rustfs\",pod=~\"rustfs-s3-.*\",container!=\"\"}[5m]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          }
        }
      ]
    }
