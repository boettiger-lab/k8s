---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbon-api
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carbon-api
  template:
    metadata:
      labels:
        app: carbon-api
      annotations:
        # Roll the pod when the config changes -- it is read once at start.
        checksum/config: "2026-11-21-display-names"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: carbon-api
          image: ghcr.io/boettiger-lab/nimbus-carbon-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PROMETHEUS_URL
              value: "http://prometheus-server.monitoring.svc.cluster.local"
            - name: SCRAPE_INTERVAL
              value: "30s"
            - name: LISTEN_ADDR
              value: ":8080"
            - name: NODES_FILE
              value: /etc/carbon-api/nodes.json
            - name: MODELS_FILE
              value: /etc/carbon-api/models.json
          volumeMounts:
            - name: nodes
              mountPath: /etc/carbon-api
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: nodes
          configMap:
            name: carbon-api-nodes
---
apiVersion: v1
kind: Service
metadata:
  name: carbon-api
  namespace: monitoring
spec:
  selector:
    app: carbon-api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carbon-api
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
  labels:
    app: carbon-api
spec:
  ingressClassName: traefik
  rules:
  # New primary name: the dashboard is no longer about one machine.
  - host: carbon.carlboettiger.info
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: carbon-api
            port:
              number: 80
  # Kept so existing links and docs do not 404.
  - host: carbon-cirrus.carlboettiger.info
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: carbon-api
            port:
              number: 80
  tls:
  - hosts:
    - carbon.carlboettiger.info
    - carbon-cirrus.carlboettiger.info
    secretName: carbon-api-tls
