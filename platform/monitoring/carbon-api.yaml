# carbon-api -- the cluster's LLM carbon/performance dashboard.
#
# ONE deployment for the whole cluster, live at https://carbon.carlboettiger.info
# (carbon-cirrus.carlboettiger.info still resolves here so older links keep
# working). One card per SERVED MODEL, with a Live / Aggregate (24h/7d/15d)
# toggle; a model scaled to 0 keeps its card and its record for as long as
# Prometheus retains its series (15d).
#
# Models are DISCOVERED from vLLM's metrics -- nothing below lists them for the
# service to find. What is configured is data, not code:
#
#   nodes.json   every node that serves (or has served) models. Power is the
#                node's TOTAL GPU power, attributed to a model only while that
#                model is serving there, so GPU time serving no LLM (cirrus's
#                speech-to-text) is counted nowhere.
#                power_hosts: every DCGM host whose watts belong to that node's
#                models. A tensor-parallel model lists every rank -- only the
#                head exports vLLM metrics, but the worker draws half the
#                power. A host may be claimed once.
#   models.json  optional display names, keyed by served model name, or
#                "model@node" where a name is reused on two nodes ("qwen" has
#                been more than one checkpoint on nimbus).
#
# Both are read once at start: edit, then bump checksum/config below (or
# `kubectl -n monitoring rollout restart deployment/carbon-api`).
#
# Requires the monitoring stack (Prometheus + dcgm-exporter) from ./install.sh
# and the prometheus.io/scrape annotations on the vLLM services
# (services/vllm/endpoints.yaml, and the TP2 pair's own Service in
# services/vllm/deepseek-v4-flash-gb10pair.yaml).
#
# Source: https://github.com/boettiger-lab/nimbus-carbon-api
apiVersion: v1
kind: ConfigMap
metadata:
  name: carbon-api-nodes
  namespace: monitoring
data:
  nodes.json: |
    [
      {"name": "cirrus",  "gpu_hardware": "Quadro RTX 8000", "gpu_count": 2},
      {"name": "nimbus",  "gpu_hardware": "NVIDIA GB10",     "gpu_count": 1},
      {"name": "nimbus2", "gpu_hardware": "NVIDIA GB10",     "gpu_count": 2,
       "power_hosts": ["nimbus2", "nimbus4"]},
      {"name": "nimbus3", "gpu_hardware": "NVIDIA GB10",     "gpu_count": 1}
    ]
  models.json: |
    {
      "deepseek-v4-flash": {
        "display_name": "DeepSeek-V4-Flash-DSpark",
        "description": "FP8 weights, NVFP4 KV cache, DSpark speculative decoding (k=5), tensor-parallel across two GB10s"
      },
      "qwen@nimbus": {
        "display_name": "Qwen3.8-Flash-Next NVFP4",
        "description": "MoE, PLE table mmapped from NVMe, MTP speculative decoding"
      },
      "laguna": {
        "display_name": "Laguna S 2.1 NVFP4",
        "description": "ennerd all-48-layer NVFP4 checkpoint; scaled to 0 (loops on agentic traffic)"
      },
      "qwen3-8": {
        "display_name": "Qwen3.8-27B AWQ INT4",
        "description": "Dense, MTP speculative decoding; scaled to 0 since cirrus became an ASR node"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbon-api
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carbon-api
  template:
    metadata:
      labels:
        app: carbon-api
      annotations:
        # Roll the pod when the config changes -- it is read once at start.
        checksum/config: "2026-09-24-per-model-4nodes"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: carbon-api
          image: ghcr.io/boettiger-lab/nimbus-carbon-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PROMETHEUS_URL
              value: "http://prometheus-server.monitoring.svc.cluster.local"
            - name: SCRAPE_INTERVAL
              value: "30s"
            - name: LISTEN_ADDR
              value: ":8080"
            - name: NODES_FILE
              value: /etc/carbon-api/nodes.json
            - name: MODELS_FILE
              value: /etc/carbon-api/models.json
          volumeMounts:
            - name: nodes
              mountPath: /etc/carbon-api
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: nodes
          configMap:
            name: carbon-api-nodes
---
apiVersion: v1
kind: Service
metadata:
  name: carbon-api
  namespace: monitoring
spec:
  selector:
    app: carbon-api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carbon-api
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
  labels:
    app: carbon-api
spec:
  ingressClassName: traefik
  rules:
  # New primary name: the dashboard is no longer about one machine.
  - host: carbon.carlboettiger.info
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: carbon-api
            port:
              number: 80
  # Kept so existing links and docs do not 404.
  - host: carbon-cirrus.carlboettiger.info
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: carbon-api
            port:
              number: 80
  tls:
  - hosts:
    - carbon.carlboettiger.info
    - carbon-cirrus.carlboettiger.info
    secretName: carbon-api-tls
