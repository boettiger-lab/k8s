# JupyterHub homes on JuiceFS (as-code), auto-loaded by the Grafana sidecar.
# Data: jupyter_home_* from home-quota-exporter (../juicefs/home-quota-exporter.yaml),
# JuiceFS's own per-directory quota counters. A home appears after its first
# mount. File counts matter as much as bytes here: small-file-heavy homes are the
# slow ones on JuiceFS (every file is a metadata round trip).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-homes
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Storage"
data:
  homes.json: |
    {
      "uid": "jupyter-homes",
      "title": "JupyterHub homes (JuiceFS)",
      "tags": ["storage", "jupyterhub", "juicefs"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "5m",
      "time": {"from": "now-7d", "to": "now"},
      "templating": {"list": []},
      "annotations": {"list": []},
      "panels": [
        {
          "id": 1,
          "type": "bargauge",
          "title": "Quota used",
          "gridPos": {"h": 10, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "sort_desc(jupyter_home_used_bytes / jupyter_home_quota_bytes)", "legendFormat": "{{pvc}}", "instant": true}
          ],
          "options": {"orientation": "horizontal", "displayMode": "basic", "showUnfilled": true, "reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "min": 0, "max": 1,
              "thresholds": {"mode": "absolute", "steps": [
                {"color": "green", "value": null},
                {"color": "orange", "value": 0.9},
                {"color": "red", "value": 0.98}
              ]}
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "table",
          "title": "Homes",
          "gridPos": {"h": 10, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "jupyter_home_used_bytes", "format": "table", "instant": true},
            {"refId": "B", "expr": "jupyter_home_quota_bytes", "format": "table", "instant": true},
            {"refId": "C", "expr": "jupyter_home_used_inodes", "format": "table", "instant": true}
          ],
          "transformations": [
            {"id": "merge", "options": {}},
            {"id": "organize", "options": {
              "excludeByName": {"Time": true, "__name__": true, "instance": true, "job": true, "namespace": true, "node": true, "service": true, "app": true, "pod": true},
              "renameByName": {"pvc": "Home", "Value #A": "Used", "Value #B": "Quota", "Value #C": "Files"}
            }},
            {"id": "sortBy", "options": {"sort": [{"field": "Used", "desc": true}]}}
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {"matcher": {"id": "byName", "options": "Used"}, "properties": [{"id": "unit", "value": "bytes"}]},
              {"matcher": {"id": "byName", "options": "Quota"}, "properties": [{"id": "unit", "value": "bytes"}]},
              {"matcher": {"id": "byName", "options": "Files"}, "properties": [{"id": "unit", "value": "short"}]}
            ]
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Used over time",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 10},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "jupyter_home_used_bytes", "legendFormat": "{{pvc}}"}
          ],
          "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"fillOpacity": 0}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"]}, "tooltip": {"mode": "multi"}}
        }
      ]
    }
