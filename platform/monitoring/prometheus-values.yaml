# Prometheus metrics store for dcgm-exporter, vLLM /metrics, and smartctl-exporter.
#
# Alertmanager is ON as of 2026-09-13. It was off ("not needed yet") until two
# failures proved otherwise on the same day: the JuiceFS metadata database
# refused connections at ~42/sec and was found by hand hours later, and the
# JuiceFS CSI controller was found in CrashLoopBackOff with 480+ restarts over
# SEVENTEEN DAYS, every one an OOMKill. Separately, thelio has died silently
# four times and nothing ever reported it. See k8s issue #73.
#
# kube-state-metrics is ON since 2026-09-25, but ALLOWLISTED to seven metrics
# (see its block below). Unrestricted it adds real series volume, and this
# Prometheus has had cardinality trouble before (see the guards below).
alertmanager:
  enabled: true
  persistence:
    storageClass: openebs-zfs
    size: 2Gi
  # The Slack webhook URL is a CREDENTIAL and this repo is PUBLIC, so it is read
  # from a Secret at runtime via slack_api_url_file -- it must never appear in
  # this file. Create it out of band (documented in the private cluster-ops
  # repo), with the URL as the single key `slack_api_url`:
  #
  #   kubectl create secret generic alertmanager-slack -n monitoring \
  #     --from-literal=slack_api_url='https://hooks.slack.com/services/XXX/YYY/ZZZ'
  #
  # Rotating the webhook = recreate the Secret and restart the statefulset;
  # no change to this file.
  extraSecretMounts:
    - name: slack-webhook
      mountPath: /etc/alertmanager/secrets
      secretName: alertmanager-slack
      readOnly: true
  config:
    global:
      resolve_timeout: 5m
      # Read from the mounted Secret, never from this file.
      slack_api_url_file: /etc/alertmanager/secrets/slack_api_url
    route:
      group_by: ['alertname', 'node']
      group_wait: 30s
      group_interval: 5m
      # Long repeat: these are conditions someone must act on, not pages to ack.
      # 24h, not 12h: a known-bad box (thelio is expected to be down over a
      # week) should be a once-a-day reminder, not twice. Anything needing
      # faster attention than that needs a human watching, not a louder alert.
      repeat_interval: 24h
      receiver: 'default'
    # A dead node makes every scrape against it fail, so ScrapeTargetMissing
    # fires alongside NodeDown for the same box -- two alerts, one cause, both
    # repeating every 12h for as long as the node is down. Suppress the
    # consequence while the cause is firing. thelio being down for a week would
    # otherwise be ~28 messages, which is how a channel gets muted.
    inhibit_rules:
      - source_matchers:
          - alertname = "NodeDown"
        target_matchers:
          - alertname =~ "ScrapeTargetMissing|ThelioFall"
        # Only inhibits on the SAME node -- a target failing on a healthy node
        # is still real news and still alerts.
        equal: ['node']
    receivers:
      - name: 'default'
        slack_configs:
          - channel: '#cirrus-alerts'
            # Also post when a condition clears, so a firing alert that goes
            # quiet is visibly resolved rather than just absent -- otherwise a
            # node that comes back looks identical to an alert nobody noticed.
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}{{ if .CommonLabels.node }} on {{ .CommonLabels.node }}{{ end }}'
            text: >-
              {{ range .Alerts }}{{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}
# kube-state-metrics: ON, allowlisted. Enabled 2026-09-25 after a cirrus reboot
# left MinIO in ImagePullBackOff for ~40 min with nothing alerting: a container
# that never starts emits no cAdvisor series, so ContainerRestartLoop cannot see
# it, and nothing else here saw Deployment status at all. Only the collectors
# and metrics the workload rules read are exported -- one series per
# Deployment/StatefulSet (x2 each) plus one per currently-WAITING container, a
# few hundred series in total. Add to the allowlist deliberately, not wholesale.
#
# `nodes` added 2026-09-29 for Gb10NoAllocatableGpu: two metrics, a few
# series per node (one allocatable series per resource, one per taint).
kube-state-metrics:
  enabled: true
  collectors: [deployments, statefulsets, pods, nodes]
  metricAllowlist:
    - kube_node_status_allocatable
    - kube_node_spec_taint
    - kube_deployment_spec_replicas
    - kube_deployment_status_replicas_available
    - kube_statefulset_replicas
    - kube_statefulset_status_replicas_ready
    - kube_pod_container_status_waiting_reason
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }
# node-exporter: ON, on the standard :9100. (Was briefly on :9101 to avoid the
# armada-pulsar node-exporter that owned :9100; armada was torn down 2026-07-11,
# so :9100 is free again and ours uses the default.)
prometheus-node-exporter:
  enabled: true
  # CARDINALITY GUARD. Without these the filesystem collector reports every
  # kubelet pod-volume bind mount and every containerd sandbox /shm — 325k
  # distinct `mountpoint` values on cirrus alone (230k under
  # /var/lib/kubelet/pods, 95k under /run/k3s/containerd), each × ~8
  # node_filesystem_* metrics, and every one of them churns to a brand-new
  # series when a pod restarts. Millions of head series on its own.
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/k3s/containerd/.+|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+|var/lib/rancher/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
    # Textfile collector for cluster/os-updates/apt-metrics.sh (host timer writes
    # /var/lib/node_exporter/textfile_collector/apt.prom; the host root is already
    # mounted read-only at /host/root). About eight series per node -- no
    # bearing on the cardinality guard above.
    - --collector.textfile.directory=/host/root/var/lib/node_exporter/textfile_collector
prometheus-pushgateway:
  enabled: false

server:
  retention: "15d"
  # Second brake: never let the TSDB fill the volume. A full /data stops
  # compaction, which pins everything in the head — that is how RAM ran away.
  retentionSize: "40GB"
  persistentVolume:
    storageClass: openebs-zfs
    size: 100Gi
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 8Gi

# ---------------------------------------------------------------------------
# Scrape jobs. The chart exposes its defaults as a map keyed by job name, so
# these entries patch/disable individual jobs rather than restating the list.
#
# The stock kubernetes-nodes / kubernetes-nodes-cadvisor jobs do
# `labelmap __meta_kubernetes_node_label_(.+)`, which stamps all 127 node
# labels — including 88 NFD feature.node.kubernetes.io/* labels — onto every
# series from those jobs. Prometheus reported 0.5–1.3 GB of label memory *per
# NFD label*. Both jobs below set an explicit `node` label instead.
# ---------------------------------------------------------------------------
scrapeConfigs:
  # Nothing in this cluster sets the prometheus.io/scrape_slow annotation, and
  # there is no blackbox-exporter behind kubernetes-services. All had 0 targets.
  kubernetes-pods-slow:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  kubernetes-services:
    enabled: false
  prometheus-pushgateway:
    enabled: false

  kubernetes-nodes:
    relabel_configs:
      - action: replace
        source_labels: [__meta_kubernetes_node_name]
        target_label: node

  # cAdvisor raw output is ~2M series here (container_tasks_state,
  # container_memory_failures_total, and a per-cgroup `id`/`name` label pair for
  # every systemd slice on the box). No dashboard in this repo reads container_*,
  # so keep a small allowlist for ad-hoc per-pod queries and drop the rest.
  kubernetes-nodes-cadvisor:
    relabel_configs:
      - action: replace
        source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      # spec_memory_limit_bytes and start_time_seconds added 2026-09-13 for the
      # alert rules. THIS DOES NOT WEAKEN THE CARDINALITY GUARD: both are one
      # series per container (not per cgroup), the `container=""` drop below
      # still removes the node-level cgroups, and the id/name labeldrop still
      # applies. Together they add on the order of a hundred series, against the
      # ~2M this allowlist exists to prevent. They are what make
      # ContainerRestartLoop and ContainerMemoryNearLimit possible without
      # kube-state-metrics.
      - action: keep
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|memory_rss|spec_memory_limit_bytes|start_time_seconds|network_(receive|transmit)_bytes_total|fs_(reads|writes)_bytes_total)
        source_labels: [__name__]
      # Node-level cgroups (systemd slices, kubepods roots) carry no container
      # label and are not worth a series each.
      - action: drop
        regex: ""
        source_labels: [container]
      # `id` (cgroup path) and `name` (runtime container name) are the two
      # highest-cardinality labels cAdvisor emits — ~193k and ~74k distinct
      # values — and both are redundant with namespace/pod/container.
      - action: labeldrop
        regex: (id|name)

# ---------------------------------------------------------------------------
# Alert rules — TIER 1: built only from metrics already scraped here, so this
# needs no new exporters and no kube-state-metrics. See k8s issue #73 for the
# tier-2 rules (Postgres connection saturation, Released-PV backlog) and the
# exporters they require.
# ---------------------------------------------------------------------------
serverFiles:
  alerting_rules.yml:
    groups:
      - name: nodes
        rules:
          # thelio has died silently FOUR times (2026-07-23, 09-11, 09-12, and
          # the original disappearance). Nothing reported any of them, and its
          # downtime is not contained: delvol Jobs pinned to a dead node strand
          # forever and accumulate into a storage-layer outage.
          - alert: NodeDown
            expr: up{job="kubernetes-nodes"} == 0
            for: 10m
            labels: { severity: critical }
            annotations:
              summary: "Node {{ $labels.node }} has been unreachable for 10m"
              description: "Prometheus cannot scrape {{ $labels.node }}. If it is also not answering ICMP, the box is wedged rather than the kubelet."

          # thelio only. Since sp5100_tco was armed (2026-09-23) a lockup
          # self-resets in ~60 s, so a fall is now a ~90 s blip instead of the
          # multi-day outage NodeDown above is calibrated for. Measured on
          # cirrus: scrape_interval 60 s, NodeDown for: 10m,
          # ScrapeTargetMissing for: 30m -- every path MISSES a fall. Arming
          # the watchdog was a win that silently removed our ability to detect
          # the event at all, and the C2 idle-hang experiment (cluster-ops#23)
          # has no readout without this.
          #
          # NOT a change to NodeDown's `for:`. 10m is calibrated against
          # transient blips fleet-wide; lowering it everywhere to catch one box
          # would trade a blind spot for noise.
          #
          # min_over_time, not `up == 0 for: 0m`: a bare equality can fire and
          # resolve inside a single 1m evaluation cycle and never survive
          # group_wait (30s). This latches for a full 10 min after any missed
          # scrape, so the notification is always delivered.
          - alert: ThelioFall
            expr: min_over_time(up{job="kubernetes-nodes", node="thelio"}[10m]) == 0
            for: 0m
            labels: { severity: warning }
            annotations:
              summary: "thelio missed a scrape — likely a lockup + watchdog reset"
              description: >-
                Since 2026-09-23 a fall self-resets in ~60 s, so this may be the
                ONLY notification and `uptime` will look healthy afterwards.
                Time it from /var/log/thelio-deathwatch.log on cirrus: ~60-120 s
                down means the watchdog fired as intended; hours means it did
                not, and the FCH is implicated. Count falls with
                `journalctl --list-boots`, never `uptime`. See cluster-ops#1, #23.

          # thelio only. ThelioFall cannot tell a fall from a network drop: the
          # 10G switch swap on 2026-09-25 produced two gaps with no reboot. A
          # changed boot time is unambiguous, and it catches a watchdog reset
          # fast enough to slip between two scrapes, which ThelioFall misses.
          # Also fires on deliberate reboots; check for an operator shutdown
          # in `journalctl -b -1` before counting it as a fall.
          - alert: ThelioReboot
            expr: changes(node_boot_time_seconds{node="thelio"}[30m]) > 0
            for: 0m
            labels: { severity: warning }
            annotations:
              summary: "thelio rebooted — watchdog reset unless someone rebooted it"
              description: >-
                node_boot_time_seconds changed in the last 30 min. If
                `journalctl -b -1` on thelio ends without a shutdown sequence,
                this is a fall. Duration is in /var/log/thelio-deathwatch.log
                on cirrus. See cluster-ops#1, #23.

          # cluster-ops#11. Every node tainted dedicated=gb10 must advertise
          # nvidia.com/gpu. The failure this catches is silent: a device-plugin
          # DaemonSet missing the node's toleration keeps its grandfathered
          # pod (NoSchedule does not evict) until a drain, and the node then
          # comes back with zero GPUs and every vLLM pod Pending. The
          # allocatable value survives a NotReady node, so NodeDown and this
          # do not double-fire. 30m covers a driver-upgrade reboot.
          - alert: Gb10NoAllocatableGpu
            expr: |
              max by (node) (kube_node_spec_taint{key="dedicated", value="gb10"})
                unless on (node)
              (max by (node) (kube_node_status_allocatable{resource="nvidia_com_gpu"}) > 0)
            for: 30m
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.node }} is a GB10 advertising no nvidia.com/gpu"
              description: >-
                The node carries dedicated=gb10 but allocatable nvidia.com/gpu
                is 0 or absent, so no GPU pod can land there. Check the
                nvidia-device-plugin pod on the node (missing toleration,
                CrashLoop, or driver/CDI mismatch). See cluster-ops#11.

      - name: workloads
        rules:
          # THE HIGHEST-VALUE RULE HERE. Generic, needs no knowledge of any
          # particular service, and would have caught the 17-day JuiceFS CSI
          # controller OOM loop on day one -- whose failures were misread as
          # student CI bugs for weeks.
          - alert: ContainerRestartLoop
            expr: changes(container_start_time_seconds{container!=""}[1h]) > 5
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarting repeatedly"
              description: "Container {{ $labels.container }} restarted more than 5 times in an hour, sustained for 30m. Check for OOMKill (exit 137) against its memory limit."

          # rustfs was OOM-killed against a 4Gi limit after 77 days up, and was
          # back at 84% of it within 3 hours. It is a single replica and the
          # object store under every JuiceFS volume.
          - alert: ContainerMemoryNearLimit
            # The `> 0` on the denominator is load-bearing. A container with NO
            # memory limit reports container_spec_memory_limit_bytes = 0, so the
            # ratio is +Inf and trips any threshold. Without this guard the rule
            # fired on 43 limitless containers on its first evaluation -- only 58
            # containers in this cluster set a memory limit at all. Filtering to
            # `> 0` makes the series absent rather than infinite, so those
            # containers simply are not evaluated.
            expr: |
              container_memory_working_set_bytes{container!=""}
                / on(namespace, pod, container) (container_spec_memory_limit_bytes{container!=""} > 0) > 0.85
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} is near its memory limit"
              description: "Container {{ $labels.container }} has held >85% of its memory limit for 15m. An OOMKill here restarts the pod with no warning."

          # The following three need kube-state-metrics (allowlisted above).
          #
          # `for: 20m`, not 15: qwen38-flashnext is `strategy: Recreate` with a
          # ~13 min 126 GiB reload, so an intentional rollout sits below spec
          # that long. Intentional `replicas: 0` has spec 0 and never fires.
          - alert: DeploymentUnavailable
            expr: kube_deployment_status_replicas_available < kube_deployment_spec_replicas
            for: 20m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.deployment }} has fewer available replicas than desired"
              description: "Below spec for 20m. Check the pods for ImagePullBackOff, CrashLoopBackOff, or Pending. For the vLLM TP2 pair, a head waiting at world_size=2 rank=0 means the worker needs restarting first."

          - alert: StatefulSetUnavailable
            expr: kube_statefulset_status_replicas_ready < kube_statefulset_replicas
            for: 20m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.statefulset }} has fewer ready replicas than desired"
              description: "Below spec for 20m."

          # Catches what ContainerRestartLoop structurally cannot: a container
          # that never starts (image pull failures, bad config) or dies too fast
          # to be scraped between restarts. MinIO sat in ImagePullBackOff, and
          # high-seas crashlooped 11 times, both unalerted, on 2026-09-25.
          - alert: ContainerStuckWaiting
            expr: kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull|CrashLoopBackOff|CreateContainerConfigError|InvalidImageName"} == 1
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} stuck in {{ $labels.reason }}"
              description: "Container {{ $labels.container }} has been waiting with reason {{ $labels.reason }} for 15m."

      - name: disks
        rules:
          # Alerts on GROWTH, not on a non-zero count: cirrus and thelio both
          # carry long-standing flat pending-sector counts (sda 16, sdd 8, flat
          # across 16k samples since 2025-07-23). A static count is a watch
          # item; a rising one is a failing disk.
          - alert: DiskPendingSectorsRising
            expr: increase(smartctl_device_attribute{attribute_id="197",attribute_value_type="raw"}[24h]) > 0
            for: 1h
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.node }} {{ $labels.device }}: pending sectors rising"
              description: "Current_Pending_Sector increased in the last 24h. A flat count is normal wear; a rising one means the drive is failing."

      - name: os-updates
        rules:
          # Series come from cluster/os-updates/apt-metrics.sh on each node; the
          # policy is in cluster/os-updates/README.md. All of these failures
          # were SILENT until 2026-09-28: cirrus's unattended-upgrades matched
          # no origin and installed nothing for a year, and the GB10s never had
          # it installed. Nothing logged an error in either case.

          # A node with no apt metrics, or with auto-updates switched off: the
          # install script was never run there (a newly joined node), or
          # unattended-upgrades was removed. Checked against node_uname_info
          # so a node that simply lacks the series is still caught.
          - alert: OsAutoUpdatesMissing
            expr: count by (node) (node_uname_info) unless on(node) (node_apt_unattended_upgrades_enabled == 1)
            for: 2h
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.node }} has no automatic OS security updates"
              description: "No apt metrics, or unattended-upgrades disabled. Run cluster/os-updates/install-os-updates.sh on the node."

          - alert: OsAutoUpdatesStalled
            expr: time() - node_apt_unattended_upgrades_last_run_timestamp_seconds > 3 * 86400
            for: 1h
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.node }}: unattended-upgrades has not run for 3 days"
              description: "Check apt-daily-upgrade.timer, and look in /var/log/unattended-upgrades/ for a held dpkg lock or a broken package."

          # Runs daily but installs nothing: the cirrus failure. security_auto
          # counts only the updates the policy SHOULD install (the held
          # kernel/GPU/ZFS packages are excluded), so after a nightly run this
          # returns to 0. Nonzero for 3 straight days means the nightly run is
          # skipping them. If one package is stuck for a legitimate reason (a
          # dependency only in -updates), `sudo unattended-upgrade --dry-run -d`
          # on the node names it.
          - alert: OsSecurityUpdatesNotApplying
            expr: min_over_time(node_apt_upgrades_pending{class="security_auto"}[3d]) > 0 and on(node) (node_apt_unattended_upgrades_enabled == 1)
            for: 1h
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.node }}: security updates pending for 3 days despite unattended-upgrades"
              description: "{{ $value }} security updates are eligible for automatic install but have not been applied. Run `sudo unattended-upgrade --dry-run -d` on the node."

          # Reboots are manual on this cluster (cirrus must never be cordoned, and a
          # GB10 reboot drops a loaded model), so they need a reminder instead.
          - alert: NodeRebootPending
            expr: time() - node_reboot_required_timestamp_seconds > 14 * 86400
            for: 1h
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.node }} has needed a reboot for 14 days"
              description: "/var/run/reboot-required is set. Reboot in a window: cluster/node-drain-reboot.md for workers, a planned outage for cirrus."

          # The kernel/GPU/ZFS packages held back on purpose. Not a fault -- a
          # reminder that a manual maintenance window is due (README.md).
          - alert: OsMaintenanceDue
            expr: min_over_time(node_apt_upgrades_pending{class="security_held"}[7d]) > 0
            for: 1h
            labels: { severity: info }
            annotations:
              summary: "{{ $labels.node }}: held kernel/GPU/ZFS security updates pending for 7 days"
              description: "{{ $value }} held security updates. Upgrade in a maintenance window, one node at a time: cluster/os-updates/README.md."

      - name: monitoring
        rules:
          # If a scrape target disappears the alerts above go quiet rather than
          # firing -- absence of data must itself be visible. Several debugging
          # queries during the 2026-09-13 incident returned empty and were
          # nearly misread as evidence that the condition was absent.
          - alert: ScrapeTargetMissing
            # Excludes kubernetes-nodes: NodeDown already owns node-level
            # failure, and without this a single dead node fires six alerts
            # (one per job scraping it) for one root cause.
            expr: up{job!="kubernetes-nodes"} == 0
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "Scrape target {{ $labels.job }} down for 30m"
              description: "Alerts derived from this target are now silent, not passing."
