# Long timeouts for inference, shared by every vLLM endpoint in the cluster.
#
# A big prefill can easily exceed Traefik's default response-header timeout, and
# both cirrus/endpoint.yaml and nimbus/endpoint.yaml reference this same object
# as `vllm-vllm-long-timeout@kubernetescrd`. It lives in its own file, applied by
# both up.sh scripts, so there is exactly one definition -- two copies in two
# manifests would be a silent drift hazard the day one of them is tuned.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: vllm-long-timeout
  namespace: vllm
spec:
  forwardingTimeouts:
    dialTimeout: 30s
    responseHeaderTimeout: 600s
    idleConnTimeout: 600s
    readIdleTimeout: 600s
