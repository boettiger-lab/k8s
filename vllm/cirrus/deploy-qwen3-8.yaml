apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-8
  namespace: vllm
  labels:
    k8s-app: vllm-cirrus-qwen3-8
spec:
  replicas: 1
  # GPU deployments must use Recreate: a rolling update would deadlock waiting
  # for GPU capacity the outgoing pod still holds.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      k8s-app: vllm-cirrus-qwen3-8
  template:
    metadata:
      labels:
        k8s-app: vllm-cirrus-qwen3-8
        # Selected by the shared vllm-service (see endpoint.yaml): whichever
        # model is scaled up owns https://vllm-cirrus.carlboettiger.info
        vllm-endpoint: cirrus
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: cirrus
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: vllm-huggingface-token
              key: token
        - name: VLLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: vllm-api-key
              key: api-key
        - name: OMP_NUM_THREADS
          value: "4"
        args:
        # Qwen3.8-27B is a *dense* 27B: BF16 weights are 55.6GB, which does not
        # fit one 48GB RTX 8000, so: 4-bit.
        #
        # TP=2 was measured end-to-end on 2026-08-18 and is a NET LOSS here.
        # Keep TP=1. Two things the old note in this file got wrong, and one
        # real reason not to do it:
        #
        # 1. "A 2-GPU request usually lands twice on the same physical card"
        #    is false. With nvidia.com/gpu: 2 the pod's NVIDIA_VISIBLE_DEVICES
        #    holds two DISTINCT physical UUIDs, nvidia-smi -L shows both, and
        #    vLLM brings up world_size=2 rank 0/1. Head counts all divide by 2
        #    (24 q / 4 kv / 48 GDN v / 16 GDN k).
        # 2. "No usable TP=2" is also false. Plain TP=2 wedges forever right
        #    after "vLLM is using nccl==2.30.7" (both GPUs spinning at
        #    100%/~125W, readiness never true). Adding NCCL_P2P_DISABLE=1 plus
        #    --disable-custom-all-reduce clears it and the engine comes up:
        #    weights shard to 11.5GB/card, KV cache 913,842 tokens (vs 350,745),
        #    concurrency 6.97x (vs 2.68x), prefill 1.5x @7k / 1.88x @28k.
        #    (It also needs cpu 8 / memory 32Gi / dshm 4Gi for the second
        #    worker; the values below are sized for TP=1.)
        # 3. The reason not to: that NCCL workaround routes every all-reduce
        #    through host shared memory, and DECODE pays two all-reduces per
        #    layer x 64 layers *per token* while prefill (compute-bound) barely
        #    notices. Measured decode fell to ~8-10 tok/s from TP=1's ~50. On
        #    the geo-agent ca-30x30 regression slice decode is 82% of wall
        #    time, so TP=2 lost badly overall (2.18h for 10 questions) and one
        #    question blew past the client's 900s per-call budget and failed
        #    where TP=1 finishes.
        #
        # Still open: only --disable-custom-all-reduce may be needed. Both
        # variables were changed at once, so it is unknown whether P2P itself
        # throttles the all-reduce. If P2P works, TP=2 could win on both axes.
        # Test it in a scratch Deployment WITHOUT the vllm-endpoint label -- a
        # hang there is harmless, whereas on this Deployment readiness never
        # goes true, the shared Service drops its only backend, and clients get
        # 503s (that mistake cost ~12 min of downtime).
        #
        # Cost of staying at TP=1: GPU 1 idles at 300MHz/25W while GPU 0 pegs
        # 100%/250W through every prefill. Accepted, because decode is what the
        # agentic workload is actually bound by.
        #
        # Prefill is NOT the thing to tune next: with --enable-prefix-caching
        # below, the geo-agent slice hit 84.9% prefix-cache reuse (942,400 of
        # 1,109,583 blocks), leaving prefill at 18% of wall time.
        #
        # Checkpoint choice: this is AutoAWQ format (quant_method "awq", version
        # "gemm"), the same kernel path already proven on this Turing box by
        # the retired qwen3-6 deployment. The popular cyankiwi/Qwen3.8-27B-AWQ-INT4 is compressed-tensors
        # WNA16 instead -- nominally cc>=7.5 in current vLLM, but unproven here.
        # It also ships the mtp.* weights, so MTP speculative decoding works.
        - --model
        - shawnw3i/Qwen3.8-27B-AWQ-MTP
        - --served-model-name
        - qwen3-8
        - --dtype
        - auto
        - --trust-remote-code
        - --tensor-parallel-size
        - "1"
        # cirrus is time-sliced (no VRAM cap); give vLLM essentially the whole 48GB card.
        - --gpu-memory-utilization
        - "0.95"
        # KV is 64KiB/token here (16 full-attention layers x 4 KV heads x head_dim
        # 256 x2 x fp16) = ~8.6GB per full-length sequence, so 131k is the sane
        # ceiling on 48GB even though the config allows 262k.
        - --max-model-len
        - "131072"
        # First pass: text only. The checkpoint is a native VLM and the vision
        # tower is small (~1.1GB fp16), so this can be revisited once the text
        # path is proven stable.
        - --limit-mm-per-prompt
        - '{"image": 0, "audio": 0, "video": 0}'
        # Both qwen3_coder and qwen3_xml now alias the same engine-backed
        # Qwen3EngineToolParser (structural_tag_model "qwen_3_coder") upstream;
        # the old Python StreamingXMLToolCallParser -- and with it the #43713
        # multi-<function> state bug that nimbus patches around via
        # qwen3_xml_patched -- is gone. Use the built-in, no --tool-parser-plugin.
        - --enable-auto-tool-choice
        - --tool-call-parser
        - qwen3_coder
        - --reasoning-parser
        - qwen3
        # Same head_dim 256 as the retired qwen3-6: the default FlashInfer backend crashes in
        # the prefill kernel (BatchPrefillWithPagedKVCache: invalid argument), and
        # FLASH_ATTN needs compute capability >= 8 (this is a Turing RTX 8000,
        # cc 7.5). Triton is the stable backend here.
        - --attention-backend
        - TRITON_ATTN
        # Hybrid GDN model (48 linear-attention layers + full attention every 4th).
        # CUDA graph capture requires max_num_seqs <= available Mamba cache blocks,
        # and this model's recurrent state is ~150MB/seq (48 v-heads x 128 x 128
        # fp32 x 48 layers) -- far bigger than Qwen3.6-35B-A3B's, so start conservative.
        - --max-num-seqs
        - "16"
        # MTP speculative decoding: this checkpoint ships the mtp.* weights.
        - --speculative-config
        - '{"method":"mtp","num_speculative_tokens":3}'
        - --max-num-batched-tokens
        - "8192"
        - --enable-prefix-caching
        # The checkpoint's generation_config defaults to temperature=1.0; force
        # greedy by default (clients may still override), as on nimbus.
        - --override-generation-config
        - '{"temperature": 0.0}'
        # With a shared endpoint, the Service must not route to an engine that
        # is still loading (weights + graph capture can take ~6 min cold, ~2 min
        # warm), otherwise a model switch serves 502s. Readiness only, no
        # liveness: a wedged engine stays up for debugging instead of
        # crash-looping. /health needs no auth.
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 60
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: hf-cache
          mountPath: /root/.cache/huggingface
        - name: vllm-cache
          mountPath: /root/.cache/vllm
        resources:
          requests:
            cpu: 4
            memory: 16Gi
            nvidia.com/gpu: 2
          limits:
            cpu: 4
            memory: 16Gi
            nvidia.com/gpu: 2
        securityContext:
          capabilities:
            add:
            - IPC_LOCK
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: vllm-cache
        # torch.compile / AOT artifacts. Without this on the host, every pod
        # restart recompiles from scratch (~80s) since /root/.cache/vllm would
        # otherwise live in the container's ephemeral layer.
        hostPath:
          path: /home/cboettig/.cache/vllm
          type: DirectoryOrCreate
      - name: hf-cache
        hostPath:
          path: /home/cboettig/.cache/huggingface
          type: Directory
