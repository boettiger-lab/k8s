# hash-archive (https://github.com/btrask/hash-archive) on cirrus k3s.
#
# Replaces the long-running Docker container `hash-archive` (host networking,
# port 8000, bind-mounting /minio/hash-archive/hash-archive.db). That container
# was the last consumer of /minio, which is being reclaimed.
#
# Runs the modern image built from ../Dockerfile (Ubuntu 22.04 multi-stage,
# 90 MB) rather than the 2020 Ubuntu-16.04 one (663 MB), which recompiled itself
# on every container start and SEGFAULTED (exit 139) ~5s after startup under k8s.
#
# ONE THING IS STILL UNUSUAL: the app returns 403 unless the Host header matches
# the hostname compiled into config.h, so every probe must send it explicitly or
# the pod never becomes ready. See README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hash-archive
  namespace: hash-archive
  labels:
    k8s-app: hash-archive
spec:
  replicas: 1
  # LevelDB is single-writer: two pods sharing the PVC would contend on LOCK
  # and risk corruption. Recreate guarantees the old pod is gone before the new
  # one starts (RollingUpdate would briefly run both).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      k8s-app: hash-archive
  template:
    metadata:
      labels:
        k8s-app: hash-archive
    spec:
      # openebs-zfs volumes live in cirrus's `tank` pool, so the pod must be here.
      nodeSelector:
        kubernetes.io/hostname: cirrus
      # The image runs as uid 10001, but the migrated LevelDB files are
      # root-owned. fsGroup makes kubelet chown the volume so the unprivileged
      # process can write it.
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: hash-archive
        # Built by .github/workflows/hash-archive-image.yml. Until that has run,
        # ./import-image.sh side-loads a locally built copy into k3s containerd,
        # so IfNotPresent avoids a doomed pull. Switch to Always once CI publishes.
        image: ghcr.io/boettiger-lab/hash-archive:latest
        imagePullPolicy: IfNotPresent
        # Unmaintained C network code that parses hostile input by design —
        # give it the smallest possible blast radius. readOnlyRootFilesystem is
        # NOT set: config.h hardcodes CONFIG_IMPORT_SOCKET_PATH "./import.sock",
        # so the working directory must stay writable.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        # No command override: the image's ENTRYPOINT (tini) and CMD are correct,
        # and the hostname is compiled in at BUILD time, so there is nothing to
        # rewrite or rebuild at startup.
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        volumeMounts:
        # config.h uses paths relative to the working directory, which is /app
        # in the new image (it was /hash-archive in the old one).
        - name: data
          mountPath: /app/hash-archive.db
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            # The startup `make` is the only CPU-hungry moment; steady state is
            # a small Go/C server over a 624 KB LevelDB.
            cpu: 2
            memory: 2Gi
        # The app 403s any request whose Host does not match $URL, so every
        # probe must send it — otherwise the probe sees 403 and the pod never
        # becomes ready.
        startupProbe:
          httpGet:
            path: /
            port: 8000
            httpHeaders:
            - name: Host
              value: hash-archive.carlboettiger.info
          # The image no longer builds at startup, so this is quick now.
          periodSeconds: 5
          failureThreshold: 12
        readinessProbe:
          httpGet:
            path: /
            port: 8000
            httpHeaders:
            - name: Host
              value: hash-archive.carlboettiger.info
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 8000
            httpHeaders:
            - name: Host
              value: hash-archive.carlboettiger.info
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: hash-archive-data
