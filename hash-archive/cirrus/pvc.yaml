# Persistent store for hash-archive's LevelDB.
#
# Migrated off the old Docker bind-mount at /minio/hash-archive/hash-archive.db
# (the pre-k3s MinIO-era tree, which is being reclaimed). On openebs-zfs it
# lands on cirrus `tank`, gaining checksums, snapshots and mirror redundancy
# that the hostPath never had.
#
# Uses openebs-zfs-ext4 (a ZFS zvol formatted ext4). See storageclass.yaml —
# that choice was made chasing a crash it turned out not to cause, and is kept
# on its own merits. Data still lives in `tank` with ZFS redundancy.
#
# The live store is only ~624 KB; 5Gi is headroom.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hash-archive-data
  namespace: hash-archive
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-zfs-ext4
  resources:
    requests:
      storage: 5Gi
