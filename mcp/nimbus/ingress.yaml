apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-gpu-nimbus
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
  labels:
    app: mcp-gpu-nimbus
spec:
  ingressClassName: traefik
  rules:
  - host: gpu-mcp-nimbus.carlboettiger.info
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mcp-gpu-nimbus
            port:
              number: 80
  tls:
  - hosts:
    - gpu-mcp-nimbus.carlboettiger.info
    secretName: mcp-gpu-nimbus-tls
