# Copies job events from Pulsar into the lookout DB. Without it Lookout's UI
# shows no jobs at all, even though jobs run and `armadactl watch` works.
apiVersion: install.armadaproject.io/v1alpha1
kind: LookoutIngester
metadata:
  name: armada-lookoutingester
  namespace: armada
spec:
  replicas: 1
  # Core infrastructure stays on cirrus (the control-plane node); thelio and the
  # GB10s are for compute. See services/README.md "Node placement".
  nodeSelector:
    kubernetes.io/hostname: cirrus

  image:
    # Upstream lookout-ingester with Alpine packages upgraded (component-images/, #246).
    repository: ghcr.io/boettiger-lab/armada-lookout-ingester
    tag: "0.22.16-apk.1"

  applicationConfig:
    pulsar:
      URL: "pulsar://armada-pulsar-standalone.armada.svc.cluster.local:6650"
      jobsetEventsTopic: "events"

    postgres:
      connection:
        host: armada-postgresql.armada.svc.cluster.local
        port: 5432
        user: armada
        password: ${ARMADA_POSTGRES_PASSWORD}
        dbname: lookout
        sslmode: disable
