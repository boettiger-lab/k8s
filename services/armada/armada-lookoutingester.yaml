# Copies job events from Pulsar into the lookout DB. Without it Lookout's UI
# shows no jobs at all, even though jobs run and `armadactl watch` works.
apiVersion: install.armadaproject.io/v1alpha1
kind: LookoutIngester
metadata:
  name: armada-lookoutingester
  namespace: armada
spec:
  replicas: 1

  image:
    repository: gresearch/armada-lookout-ingester
    tag: "0.22.16"

  applicationConfig:
    pulsar:
      URL: "pulsar://armada-pulsar-standalone.armada.svc.cluster.local:6650"
      jobsetEventsTopic: "events"

    postgres:
      connection:
        host: armada-postgresql.armada.svc.cluster.local
        port: 5432
        user: armada
        password: ${ARMADA_POSTGRES_PASSWORD}
        dbname: lookout
        sslmode: disable
