# gresearch/armada-executor chart (pinned in install.sh). Replaces the
# armada-operator Executor CR: operator v0.7.0 renders an invalid Deployment
# (ports[2].containerPort empty) and keeps reconciling over a hand-made one.
# The chart defaults to :latest, which tracks Armada master, and nodes cache
# whatever build they pulled first (thelio held one too old for errorCategories
# onPodEvents/action). Pin to the chart's release.
image:
  tag: "0.22.16"
applicationConfig:
  application:
    # Unique ID for this k8s cluster, used in Armada job submissions
    clusterId: cirrus
    # Tag the failures the backfill retry policy requeues
    # (retry-policy-backfill.yaml). action: Delete removes the failed pod at
    # once so the retry can reuse the pod name armada-<jobId>-0; a retained pod
    # would make the retry's lease fail with AlreadyExists.
    errorCategories:
      enabled: true
      defaultCategory: unknown
      defaultSubcategory: unknown
      categories:
        # kube-scheduler evicted the pod to place a higher-priority pod
        # (notebook, service or model; Armada classes are negative).
        - name: k8s-preemption
          action: Delete
          rules:
            - onPodEvents:
                reason: Preempted
                type: Normal
                regexp: "Preempted by"
        # kubelet evicted the pod under node memory or disk pressure.
        - name: node-pressure
          action: Delete
          rules:
            - onConditions: ["Evicted"]
  kubernetes:
    # The executor reports a node with any other NoSchedule taint as
    # unschedulable, and the scheduler then leaves it out of the pool whatever
    # the job tolerates. Safe only because GB10 models request the whole node
    # and the server rejects jobs under 1Gi (armada-server.yaml).
    toleratedTaints:
      - dedicated
  executorApiConnection:
    armadaUrl: armada-scheduler.armada.svc.cluster.local:50051
    forceNoTls: true
# install.sh owns the PriorityClasses (kubectl apply); helm cannot adopt them.
priorityClasses: []
