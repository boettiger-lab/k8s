apiVersion: install.armadaproject.io/v1alpha1
kind: ArmadaServer
metadata:
  name: armada-server
  namespace: armada
spec:
  replicas: 1
  pulsarInit: false

  image:
    repository: gresearch/armada-server
    tag: "latest"

  # gRPC API ingress — Traefik requires h2c (HTTP/2 cleartext) backend scheme
  ingress:
    ingressClass: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/service.serverScheme: h2c
      cert-manager.io/cluster-issuer: letsencrypt-production

  hostNames:
    - armada-api.carlboettiger.info

  clusterIssuer: letsencrypt-production

  applicationConfig:
    pulsar:
      URL: "pulsar://armada-pulsar-standalone.armada.svc.cluster.local:6650"

    postgres:
      connection:
        host: armada-postgresql.armada.svc.cluster.local
        port: 5432
        user: armada
        password: ${ARMADA_POSTGRES_PASSWORD}
        dbname: lookout
        sslmode: disable

    # Let every job reach the GB10s (taint dedicated=gb10, arm64) when they are
    # idle; models (llm-serving) and GB10 notebooks evict Armada jobs. Jobs need
    # a multi-arch image to run there. This list replaces Armada's default, so it
    # repeats the armadaproject.io/armada toleration.
    submission:
      defaultJobTolerations:
        - key: "armadaproject.io/armada"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
        - key: "dedicated"
          operator: "Equal"
          value: "gb10"
          effect: "NoSchedule"

    eventsApiRedis:
      addrs:
        - armada-redis-master.armada.svc.cluster.local:6379
      password: ""
      db: 1

    schedulerApiConnection:
      armadaUrl: "armada-scheduler.armada.svc.cluster.local:50051"
      forceNoTls: true

    auth:
      anonymousAuth: false
      # Service account for the scheduler's queue lookups (in-cluster only).
      # Password from secret armada-scheduler-api-secret via envsubst in install.sh.
      basicAuth:
        users:
          armada-scheduler:
            password: ${ARMADA_SCHEDULER_API_PASSWORD}
            groups: ["armada-system"]
      openIdAuth:
        providerUrl: https://dex.carlboettiger.info
        groupsClaim: groups
        clientId: armadactl
      # Admin rights (any queue) are owners-only. Members act only on queues whose
      # `permissions` name them: add-user.sh gives each member their own queue.
      permissionGroupMapping:
        create_queue: ["boettiger-lab:owners"]
        delete_queue: ["boettiger-lab:owners"]
        cancel_any_jobs: ["boettiger-lab:owners"]
        reprioritize_any_jobs: ["boettiger-lab:owners"]
        watch_all_events: ["boettiger-lab:owners"]
        submit_any_jobs: ["boettiger-lab:owners"]
