apiVersion: install.armadaproject.io/v1alpha1
kind: Lookout
metadata:
  name: armada-lookout
  namespace: armada
spec:
  replicas: 1

  image:
    repository: gresearch/armada-lookout
    tag: "latest"

  # No ingress, hostNames or clusterIssuer: Lookout is private. It has no
  # per-user view, so anyone who can open it sees every job's full pod spec,
  # env vars included. Owners reach it with
  #   kubectl -n armada port-forward svc/armada-lookout 8080:8080
  # and open http://localhost:8080. Users follow their own jobs with
  # `armadactl watch` / `armadactl get job-report`, which enforce queue permissions.

  applicationConfig:
    # Override API port to match what the operator's liveness probe expects (port 8080)
    apiPort: 8080

    postgres:
      connection:
        host: armada-postgresql.armada.svc.cluster.local
        port: 5432
        user: armada
        password: ${ARMADA_POSTGRES_PASSWORD}
        dbname: lookout
        sslmode: disable

    uiConfig:
      armadaApiBaseUrl: "http://armada-server.armada.svc.cluster.local:8080"
