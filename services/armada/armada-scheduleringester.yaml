apiVersion: install.armadaproject.io/v1alpha1
kind: SchedulerIngester
metadata:
  name: armada-scheduleringester
  namespace: armada
spec:
  replicas: 1
  # Core infrastructure stays on cirrus (the control-plane node); thelio and the
  # GB10s are for compute. See services/README.md "Node placement".
  nodeSelector:
    kubernetes.io/hostname: cirrus

  image:
    # Upstream scheduler-ingester with Alpine packages upgraded (component-images/, #246).
    repository: ghcr.io/boettiger-lab/armada-scheduler-ingester
    tag: "0.22.16-apk.1"

  applicationConfig:
    pulsar:
      URL: "pulsar://armada-pulsar-standalone.armada.svc.cluster.local:6650"

    postgres:
      connection:
        host: armada-postgresql.armada.svc.cluster.local
        port: 5432
        user: armada
        password: ${ARMADA_POSTGRES_PASSWORD}
        dbname: scheduler
        sslmode: disable
