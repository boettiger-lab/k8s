apiVersion: install.armadaproject.io/v1alpha1
kind: Scheduler
metadata:
  name: armada-scheduler
  namespace: armada
spec:
  replicas: 1

  image:
    repository: gresearch/armada-scheduler
    tag: "latest"

  applicationConfig:
    pulsar:
      URL: "pulsar://armada-pulsar-standalone.armada.svc.cluster.local:6650"

    postgres:
      connection:
        host: armada-postgresql.armada.svc.cluster.local
        port: 5432
        user: armada
        password: ${ARMADA_POSTGRES_PASSWORD}
        dbname: scheduler
        sslmode: disable

    grpc:
      port: 50051

    leader:
      mode: standalone

    armadaApi:
      armadaUrl: "armada-server.armada.svc.cluster.local:50051"
      forceNoTls: true
      # The server only accepts OIDC (users) or basic auth (this service account).
      basicAuth:
        username: armada-scheduler
        password: ${ARMADA_SCHEDULER_API_PASSWORD}

    # Per-queue cap. Every job runs as armada-default (the image's
    # priorityClassNameOverride), so this one class carries the limit. Fractions
    # are of the whole pool the executor reports, which INCLUDES the tainted GB10s
    # (2026-11-06: 224 CPU, 751 GiB, 49 GPU slices; untainted cirrus+thelio alone
    # are 152 CPU, 312 GiB, 17 slices). So these give each queue about 56 CPU,
    # 90 GiB and 4 GPU slices. Jobs over the cap stay queued, they are not rejected.
    # One queue can get a different cap with resourceLimitsByPriorityClassName in
    # its Queue spec (armadactl update -f), which overrides these fractions.
    scheduling:
      priorityClasses:
        armada-default:
          priority: 1000
          preemptible: false
          maximumResourceFractionPerQueue:
            cpu: 0.25
            memory: 0.12
            nvidia.com/gpu: 0.1

    auth:
      anonymousAuth: true
      permissionGroupMapping:
        execute_jobs: ["everyone"]
        submit_any_jobs: ["everyone"]
        cancel_any_jobs: ["everyone"]
        reprioritize_any_jobs: ["everyone"]
        watch_all_events: ["everyone"]
        create_queue: ["everyone"]
