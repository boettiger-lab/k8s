apiVersion: install.armadaproject.io/v1alpha1
kind: Scheduler
metadata:
  name: armada-scheduler
  namespace: armada
spec:
  replicas: 1

  image:
    repository: gresearch/armada-scheduler
    tag: "0.22.16"

  applicationConfig:
    pulsar:
      URL: "pulsar://armada-pulsar-standalone.armada.svc.cluster.local:6650"

    postgres:
      connection:
        host: armada-postgresql.armada.svc.cluster.local
        port: 5432
        user: armada
        password: ${ARMADA_POSTGRES_PASSWORD}
        dbname: scheduler
        sslmode: disable

    grpc:
      port: 50051

    leader:
      mode: standalone

    armadaApi:
      armadaUrl: "armada-server.armada.svc.cluster.local:50051"
      forceNoTls: true
      # The server only accepts OIDC (users) or basic auth (this service account).
      basicAuth:
        username: armada-scheduler
        password: ${ARMADA_SCHEDULER_API_PASSWORD}

    # No per-queue cap: Armada is backfill and should fill every idle node.
    # The pool "capacity" a fraction applies to is only what non-Armada pods
    # leave free, so a fractional cap left jobs queued on idle hardware.
    # When several queues compete, fair share orders which queue's job starts
    # next as capacity frees up.
    # Every job runs as armada-default (the image's priorityClassNameOverride).
    # preemptible: false means Armada itself never kills a running job to
    # rebalance queues: Armada does not retry runs it preempts, so that work
    # would be lost. Notebooks and models still evict Armada jobs through
    # Kubernetes priority (install.sh), and the retry policy requeues those.
    # One queue can still be capped with resourceLimitsByPriorityClassName in its
    # Queue spec (armadactl update -f).
    scheduling:
      priorityClasses:
        armada-default:
          priority: 1000
          preemptible: false
      # Requeue jobs that Kubernetes evicted for a notebook or model. Rules are
      # in retry-policy-backfill.yaml (created with armadactl), applied to every
      # queue that has no policy of its own. globalMaxRetries caps retries per
      # job; there is no unlimited setting.
      retryPolicy:
        enabled: true
        globalMaxRetries: 20
        defaultPolicyName: backfill

    auth:
      anonymousAuth: true
      permissionGroupMapping:
        execute_jobs: ["everyone"]
        submit_any_jobs: ["everyone"]
        cancel_any_jobs: ["everyone"]
        reprioritize_any_jobs: ["everyone"]
        watch_all_events: ["everyone"]
        create_queue: ["everyone"]
