# Kev decision-model server --- https://kev.carlboettiger.info
#
# Open-weight (Apache-2.0) Jev-style decision model, https://github.com/jaredpalmer/kev,
# served as an alternative to laya (services/laya) on the same POST /v1/systemone
# protocol. Kev is not on PyPI (`pip install kev` is an unrelated package), so the
# pod installs it from a pinned git commit: the commit the upstream deploy script
# (skills/kev-deploy/scripts/kev_serve.py) runs.
#
# Namespace and Secret (create once, not tracked):
#   kubectl create namespace kev
#   kubectl create secret generic kev-api-key -n kev --from-literal=api-key=<key>
#
# TURING. cirrus has Quadro RTX 8000s (sm_75). Upstream serves bf16 with the fused
# Qwen3.5 kernels from flash-linear-attention, measured on Ampere and newer. That
# package is left out here, so kev.serve falls back to transformers' reference
# kernels in bf16. Measured 2026-10-28: ~500 ms per request (upstream: tens of ms
# fused on an L40S); 64 requests at 32-way concurrency in 7 s, all 200.
#
# CAPACITY. Unlike laya-serve, kev.serve batches concurrent requests on the GPU, so
# one replica takes a class's fan-out; scale replicas only if the queue grows
# (GET /v1/models reports batches and queue depth). Kev-4B holds ~15 GB of VRAM
# (weights plus batching buffers and CUDA graphs); time-slicing does not cap that,
# so it counts against the card it lands on. Scale to 0 between terms:
#   kubectl scale deployment/kev -n kev --replicas=0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kev
  namespace: kev
  labels:
    k8s-app: kev
spec:
  replicas: 1
  # GPU deployments must use Recreate: a rolling update would deadlock waiting for
  # GPU capacity the outgoing pod still holds.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      k8s-app: kev
  template:
    metadata:
      labels:
        k8s-app: kev
    spec:
      enableServiceLinks: false
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: cirrus
      containers:
      - name: kev
        image: python:3.13-slim
        command: ["bash", "-c"]
        args:
        - >-
          apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null &&
          pip install --no-cache-dir --root-user-action=ignore
          "kev[serve] @ git+https://github.com/jaredpalmer/kev.git@fc4a17e194bca35a48c57211392ec49ea54a94ac" &&
          exec python -m kev.serve --run jaredpalmer/kev-4b@v1.0 --host 0.0.0.0 --port 8000 --device cuda
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: HF_HOME
          value: /cache/huggingface
        - name: TRITON_CACHE_DIR
          value: /cache/triton
        - name: PIP_CACHE_DIR
          value: /cache/pip
        - name: TOKENIZERS_PARALLELISM
          value: "false"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: KEV_API_KEY
          valueFrom:
            secretKeyRef:
              name: kev-api-key
              key: api-key
        readinessProbe:
          httpGet:
            # /v1/models needs the bearer key; /docs is open and only answers once
            # the model is loaded and uvicorn is up.
            path: /docs
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 90
        volumeMounts:
        - name: cache
          mountPath: /cache
        resources:
          requests:
            cpu: 2
            memory: 4Gi
            nvidia.com/gpu: 1
          limits:
            cpu: 4
            memory: 12Gi
            nvidia.com/gpu: 1
      volumes:
      # Shared across restarts, so a new pod does not re-download the model.
      - name: cache
        hostPath:
          path: /home/cboettig/.cache/kev
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: kev
  namespace: kev
  labels:
    k8s-app: kev
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    k8s-app: kev
---
# Long requests (a long document with many questions) outlast Traefik's defaults.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: kev-long-timeout
  namespace: kev
spec:
  forwardingTimeouts:
    dialTimeout: 30s
    idleConnTimeout: 600s
    readIdleTimeout: 600s
    responseHeaderTimeout: 600s
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kev
  namespace: kev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    # <namespace>-<name>@kubernetescrd
    traefik.ingress.kubernetes.io/service.servertransport: kev-kev-long-timeout@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: kev.carlboettiger.info
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kev
            port:
              number: 80
  tls:
  - hosts:
    - kev.carlboettiger.info
    secretName: kev-tls
