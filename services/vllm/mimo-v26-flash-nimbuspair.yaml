            --no-async-scheduling
            --enable-prefix-caching --enable-chunked-prefill
            --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
            --compilation-config '{"cudagraph_mode":"FULL_DECODE_ONLY","max_cudagraph_capture_size":128}'
            --reasoning-parser mimo --tool-call-parser mimo --enable-auto-tool-choice
            --override-generation-config '{"max_new_tokens": 32768}'
            --enable-log-requests --max-log-len 2000
          )
          exec vllm serve "$SNAP" "${ARGS[@]}"
        resources:
          requests: {cpu: 8, memory: 108Gi, nvidia.com/gpu: 8}
          limits: {cpu: 16, memory: 108Gi, nvidia.com/gpu: 8}
        securityContext:
          capabilities: {add: ["IPC_LOCK"]}
