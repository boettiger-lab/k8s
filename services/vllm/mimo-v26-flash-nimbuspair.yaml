        - {name: TORCH_NCCL_ASYNC_ERROR_HANDLING, value: "1"}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          R=/hf/hub/models--XiaomiMiMo--MiMo-V2.6-Flash-MOPD
          SNAP="$R/snapshots/$(cat $R/refs/main)"
          # Array, not backslash continuations (a lost `\` once dropped --headless).
          ARGS=(
