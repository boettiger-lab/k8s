# Fetch nvidia/GLM-5.3-Flash-FP4-Local (165.3 GiB; the checkpoint NVIDIA's 2x Spark recipe
# in NVIDIA/local-ai-inference-recipes uses) into the HF cache on BOTH nodes of the
# nimbus+nimbus3 TP2 pair. Re-running resumes.
#
#   kubectl apply -f fetch-glm53-flash-nimbuspair.yaml
#   kubectl -n vllm logs -f job/fetch-glm53-nimbus
#
# The download fills page cache: drop caches (drop-caches-nimbus.yaml) before the model load.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fetch-glm53-nimbus
  namespace: vllm
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: nimbus
      tolerations:
      - {key: dedicated, operator: Equal, value: gb10, effect: NoSchedule}
      containers:
      - name: fetch
        image: python:3.12-bookworm
        env:
        - {name: HF_HOME, value: /hf}
        - name: HF_TOKEN
          valueFrom: {secretKeyRef: {name: huggingface-token, key: token}}
        command: ["bash", "-c"]
        args:
        - |
          set -euo pipefail
          pip install -q 'huggingface_hub[cli]==0.36.0'
          hf download nvidia/GLM-5.3-Flash-FP4-Local
          R=/hf/hub/models--nvidia--GLM-5.3-Flash-FP4-Local; S="$R/snapshots/$(cat $R/refs/main)"
          echo "shards: $(find -L "$S" -name '*.safetensors' | wc -l)"
          echo "broken links:"; find "$S" -type l ! -exec test -e {} \; -print
          du -shL "$S"
        resources:
          requests: {cpu: "1", memory: 2Gi}
          limits: {memory: 8Gi}
        volumeMounts:
        - {name: hf, mountPath: /hf}
      volumes:
      - {name: hf, hostPath: {path: /home/cboettig/.cache/huggingface, type: Directory}}
---
