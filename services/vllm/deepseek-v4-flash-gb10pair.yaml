            nvidia.com/gpu: 8
        # Readiness only, no liveness: a hang at load leaves the pod NotReady for
        # debugging instead of crash-looping a 79 GiB load. Cold start measured ~6 min.
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 15
          failureThreshold: 80
        securityContext:
          capabilities:
            add: ["IPC_LOCK", "SYS_PTRACE"]
        volumeMounts:
        - name: hf-cache
          mountPath: /hf
        - name: dshm
          mountPath: /dev/shm
        - name: infiniband
          mountPath: /dev/infiniband
      volumes:
      - name: hf-cache
        hostPath:
          path: /home/cboettig/.cache/huggingface
          type: Directory
      - name: dshm
        emptyDir:
          medium: Memory
          # Anemll run --shm-size 64g. Allocation is lazy, so this is a ceiling.
          sizeLimit: 64Gi
      - name: infiniband
        hostPath:
          path: /dev/infiniband
