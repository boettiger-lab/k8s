    spec:
      hostNetwork: true
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: nimbus4
      tolerations:
      - key: dedicated
        value: gb10
        effect: NoSchedule
      hostAliases:
      - ip: 192.168.200.12
        hostnames:
        - nimbus2
      - ip: 192.168.200.13
        hostnames:
        - nimbus4
      volumes:
      - name: ib
        hostPath:
          path: /dev/infiniband
      - name: hf
        hostPath:
          path: /home/cboettig/.cache/huggingface
      - name: jit
        hostPath:
          path: /home/cboettig/.cache/dsv4
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 10Gi
      containers:
      - name: vllm
        image: aidendle94/sparkrun-vllm-ds4-gb10:production-ready
        command:
        - dsv4-vllm-entrypoint
        - serve
        - deepseek-ai/DeepSeek-V4-Flash
        args:
        - --served-model-name
        - deepseek-v4-flash
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --trust-remote-code
        - --tensor-parallel-size
        - '2'
        - --pipeline-parallel-size
        - '1'
        - --distributed-executor-backend
        - mp
        - --kv-cache-dtype
        - fp8
        - --block-size
        - '256'
        - --max-model-len
        - '8192'
        - --max-num-seqs
        - '8'
        - --max-num-batched-tokens
        - '8192'
        - --kv-cache-memory=6442450944
        - --gpu-memory-utilization
        - '0.76'
        - --speculative-config
        - '{"method":"mtp","num_speculative_tokens":1}'
        - -cc.cudagraph_mode=PIECEWISE
        - --enable-prefix-caching
        - --tokenizer-mode
        - deepseek_v4
        - --nnodes
        - '2'
        - --node-rank
        - '1'
        - --master-addr
