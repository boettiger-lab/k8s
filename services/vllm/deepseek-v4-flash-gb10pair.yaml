        - name: VLLM_HOST_IP
          value: 192.168.200.13
        - name: HF_HOME
          value: /hf
        - name: HF_HUB_OFFLINE
          value: '1'
        volumeMounts:
        - name: ib
          mountPath: /dev/infiniband
        - name: hf
          mountPath: /hf
        - name: jit
          mountPath: /cache
        - name: shm
          mountPath: /dev/shm
        resources:
          requests:
            memory: 90Gi
            cpu: 8
          limits:
            nvidia.com/gpu: 8
