        - {name: TF_DS_ENGRAM, value: /engram}
        - {name: TF_DS_SPILL_GIB, value: "32"}
        - {name: TF_DS_SPILL_DIR, value: /cache/tf-ds-spill}
        - {name: TF_DS_ENGRAM_DONTNEED, value: "1"}
        - {name: TF_DS_MEM_FLOOR_GIB, value: "0"}
        - {name: TF_DROP_UNOFFERED_TOOL_CALLS, value: "1"}
