githubConfigUrl: "https://github.com/espm-288"
# Consolidated onto the single github-runner-token secret — see the note in
# cirrus-espm157-values.yaml.
githubConfigSecret: github-runner-token
maxRunners: 2
runnerGroup: "default"

# containerMode: kubernetes — replaces the previous privileged docker:dind
# template, which gave any student workflow a path to root on cirrus (the
# cluster's only node and its control plane).
#
# TRADE-OFF: kubernetes mode sets ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER=true, so
# every job here MUST declare `container:`, and `options:` is unsupported.
# Lowest-risk of the three sets to convert: no espm-288 template repo references
# this runner, and it ran zero self-hosted jobs in the three months to
# 2026-08-12. See cirrus-espm-hook-template.yaml for resource/user settings.
containerMode:
  type: "kubernetes"
  kubernetesModeWorkVolumeClaim:
    # MUST be RWX — runner pod and job pod both mount _work.
    accessModes: ["ReadWriteMany"]
    storageClassName: "juicefs-sc"
    resources:
      requests:
        storage: 20Gi

template:
  spec:
    # Pin every runner pod to cirrus. thelio rejoined the cluster on 2026-08-24
    # but has unresolved disk health issues, and ARC's _work volumes are the
    # heaviest storage churn in the cluster -- a runner landing there is exactly
    # what must not happen. A cordon alone is not enough: it stops NEW pods but
    # says nothing about intent, and it gets lifted. This makes the placement
    # explicit and survives an uncordon.
    nodeSelector:
      kubernetes.io/hostname: cirrus
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        # Run the runner as 1000, not the image's baked-in 1001.
        #
        # The runner container creates _work on the shared RWX volume, and the
        # job pod mounts that same volume at /__w -- so whatever uid the runner
        # uses dictates the uid every job must use. At the image default of
        # 1001 that forced job pods to 1001 too, which is the WRONG user for
        # rocker/ml: its /opt/venv and /home/jovyan both belong to 1000. The
        # symptoms were a job that could not pip-install into its own
        # interpreter (EACCES on /opt/venv/.../site-packages) and a HOME
        # override to work around an unreadable /home/jovyan.
        #
        # Moving the runner to 1000 aligns both sides instead. Safe because
        # /home/runner in the actions-runner image is mode 0777 and uid 1000
        # already exists there as `ubuntu`, so run.sh can still write _work,
        # _diag and .runner. Verified against the image before changing this.
        #
        # NOTE this pairs with runAsUser: 1000 in cirrus-espm-hook-template.yaml.
        # The two MUST move together -- they are the two ends of one volume.
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        env:
          - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
            value: /home/runner/pod-templates/default.yaml
        volumeMounts:
          - name: pod-templates
            mountPath: /home/runner/pod-templates
            readOnly: true
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 2Gi
    volumes:
      - name: pod-templates
        configMap:
          name: espm-hook-template
