githubConfigUrl: "https://github.com/eco4cast"
githubConfigSecret: github-runner-token
# One runner. This set serves eco4cast/usgsrc4cast-ci and eco4cast/neon4cast-ci.
# It was 2 so their 23:00 UTC jobs (usgsrc4cast drivers_stage1, neon4cast
# drivers_stage3) could run side by side, but usgsrc4cast's drivers workflows
# have not run since 2026-10-08. The remaining self-hosted jobs barely overlap:
# at most a short `bundling` run waits behind drivers_stage3 (~30 min).
# With one runner, its 32Gi reservation always fits on thelio. If usgsrc4cast
# drivers return, the 23:00 pair serializes (about +30 min); set 2 to run them
# in parallel (the second then spills to cirrus).
maxRunners: 1
runnerGroup: "default"

# containerMode: kubernetes — job containers run as sibling PODS, created by
# actions/runner-container-hooks, instead of by a Docker daemon inside the runner.
#
# This replaces the previous hand-written dind template, which ran
# `docker:dind` with securityContext.privileged: true and shared /var/run with
# the runner container. That gave every workflow job a privileged Docker socket,
# i.e. a straight path to root on cirrus — which since thelio was decommissioned
# is the cluster's only node and its control plane. Removing dind closes that.
#
# Constraints this imposes on the workflows (all five current jobs comply):
#   - every job on this runner MUST specify `container:` (jobs without one fail)
#   - `options:` is NOT supported — see cirrus-efi-hook-template.yaml, which is
#     where the old --memory/--user settings moved to
#   - no docker CLI in steps, and no building container actions from a Dockerfile
# ref https://github.com/actions/runner-container-hooks/blob/main/packages/k8s/README.md
containerMode:
  type: "kubernetes"
  kubernetesModeWorkVolumeClaim:
    # local-path, not juicefs-sc. See cirrus-espm288-values.yaml for the full
    # reasoning and the negative results (openebs-zfs rejects the second mount,
    # emptyDir is impossible because the job is a sibling pod).
    #
    # The requirement was never RWX -- it is "two pods on one node must both
    # mount it", and the job pod follows the runner's PV to its node. local-path is a hostPath
    # bind mount, so it satisfies that without a metadata service.
    accessModes: ["ReadWriteOnce"]
    # ci-work: a local-path class (platform/cirrus-scratch/) that puts _work on
    # cirrus's scratch disk, not the control plane's root disk, when a runner
    # spills to cirrus; on thelio it is the usual local-path directory.
    storageClassName: "ci-work"
    resources:
      requests:
        # NOMINAL: the local-path provisioner does not enforce this, and a job
        # sees the whole root filesystem. Left at 100Gi rather than guessed
        # downward -- the forecast jobs are the heaviest thing on this cluster
        # and nobody has measured their peak _work usage. If this ever moves to
        # a provisioner that DOES enforce quotas, measure before trusting it.
        storage: 100Gi

template:
  spec:
    # A fresh local volume is root:root 0755, so without this the runner cannot
    # write it and every job dies at once with
    #   Access to the path '/home/runner/_work/_tool' is denied
    # JuiceFS volumes were permissive enough to hide this.
    #
    # 1000, matching the runner's runAsUser below and the espm sets. fsGroup
    # must match whoever creates _work; the job container here runs as root
    # (see cirrus-efi-hook-template.yaml) and can write regardless.
    #
    # OnRootMismatch, not the default Always, which re-walks the entire volume
    # on every mount -- it matters more here, where _work is the largest in the
    # cluster.
    securityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    # Interruptible, like Armada: ci-backfill (-800, preemptionPolicy Never)
    # ranks below notebooks, services and models, so the scheduler evicts a
    # runner to place them. An evicted job fails on GitHub; re-run it.
    # (ci-backfill.yaml.)
    priorityClassName: ci-backfill
    # amd64 only (cirrus or thelio); the GB10s' `dedicated` taint keeps runners
    # off them anyway. Prefer thelio: it is usually idle, while cirrus carries
    # the control plane. The runner reserves its job's memory (resources below),
    # so the scheduler only places it where the job will fit; with maxRunners 2
    # a second concurrent job would spill to cirrus.
    # The job pod follows the runner: it mounts the same local-path _work PVC,
    # whose PV is bound to the runner's node.
    nodeSelector:
      kubernetes.io/arch: amd64
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [thelio]
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        # Run as 1000, not the image's baked-in 1001, matching the espm sets.
        # One uid across every scale set means one fsGroup, and no chance of the
        # two drifting apart -- a mismatch fails every job at the first action
        # with EACCES on /__w.
        #
        # Safe because /home/runner in the actions-runner image is mode 0777 and
        # uid 1000 already exists there as "ubuntu", so run.sh can still write
        # _work, _diag and .runner. Verified against the image.
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        env:
          # Points the hooks at the merged job-pod spec (the ConfigMap).
          - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
            value: /home/runner/pod-templates/default.yaml
        volumeMounts:
          - name: pod-templates
            mountPath: /home/runner/pod-templates
            readOnly: true
        resources:
          # The request RESERVES memory for this runner's job pod. The job pod
          # is created later, on whatever node the runner landed on (it shares
          # the runner's local-path _work PV), so its own request cannot steer
          # placement. Reserving here makes the scheduler place the runner
          # where the job will fit. Forecast jobs peaked at 33Gi (30 days to
          # 2026-11-17); the job pod's 45Gi limit stays in the hook template.
          # The runner itself only orchestrates and uses far less; the limit
          # is set equal to the request because it must not be lower.
          requests:
            memory: 32Gi
          limits:
            memory: 32Gi
    volumes:
      - name: pod-templates
        configMap:
          name: efi-cirrus-hook-template

# The listener is a thin long-poll to GitHub; it is not core infrastructure, so
# prefer thelio and fall back to cirrus when thelio is away. Runner pods stay
# placed by template.spec below (interruptible; see the priorityClassName note).
listenerTemplate:
  spec:
    containers:
      - name: listener
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [thelio]
