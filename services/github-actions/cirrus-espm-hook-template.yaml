# Hook pod template shared by the espm-157 and espm-288 runner scale sets
# (containerMode: kubernetes). See cirrus-efi-hook-template.yaml for the full
# explanation of how these extensions work; the short version is that `$job`
# (CONTAINER_EXTENSION_PREFIX "$" + JOB_CONTAINER_NAME "job") targets the
# workflow's job container, and resources/securityContext are overwritten while
# name/image are protected.
#
# One ConfigMap serves both sets: they are in the same namespace and want the
# same policy. Student coursework is far lighter than the eco4cast forecast
# jobs, hence the smaller ceiling than efi-cirrus's 45Gi.
#
# Deliberately no `capabilities: drop: [ALL]` — that revokes CAP_DAC_OVERRIDE,
# and a uid-0 job container then cannot write to _work/_temp (owned by the
# runner's uid 1001). It fails every job at the first action with EACCES.
apiVersion: v1
kind: ConfigMap
metadata:
  name: espm-hook-template
  namespace: arc-runners
data:
  default.yaml: |
    apiVersion: v1
    kind: PodTemplate
    metadata:
      name: espm-job-pod
    spec:
      # Pin job pods to cirrus as well. The runner pod's nodeSelector does NOT
      # propagate: under containerMode kubernetes each `container:` job runs as
      # a SIBLING pod created by the hooks, scheduled independently. Without
      # this, a job pod can land on thelio even when its runner did not.
      nodeSelector:
        kubernetes.io/hostname: cirrus
      # The kube-mode ServiceAccount holds secrets get/list in arc-runners,
      # which is where the GitHub PAT lives. Workflow steps run in THIS pod, so
      # refuse the token projection — this matters more here than for eco4cast,
      # because these runners execute student-authored code.
      automountServiceAccountToken: false
      containers:
        - name: $job
          env:
            # No HOME override any more. It used to point at /tmp because the
            # job ran as uid 1001 and could not read jovyan's home; now that the
            # job runs as 1000 (see securityContext below), the image's own
            # HOME=/home/jovyan is correct and writable.
            # Cap thread/process fan-out. THIS IS NOT REDUNDANT WITH limits.cpu
            # below: a CPU limit is a CFS quota, and `nproc` reads the affinity
            # mask, which still reports all 128 of cirrus's cores inside the
            # container. Without these, anything that sizes itself from nproc
            # -- a pip sdist build, make -j$(nproc), OpenMP, the BLAS under
            # numpy/scipy -- still forks 128 workers and allocates 128 workers'
            # worth of RAM, just throttled to 4 cores of throughput. That is
            # slower AND still hits the memory limit. The cgroup caps CPU time;
            # only these cap concurrency.
            - name: OMP_NUM_THREADS
              value: "4"
            - name: OPENBLAS_NUM_THREADS
              value: "4"
            - name: MKL_NUM_THREADS
              value: "4"
            - name: NUMEXPR_NUM_THREADS
              value: "4"
            - name: MAKEFLAGS
              value: "-j4"
            - name: CMAKE_BUILD_PARALLEL_LEVEL
              value: "4"
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              # Caps a runaway student job. Two concurrent runners per set,
              # three sets, so the worst case stays well inside cirrus's RAM.
              memory: 8Gi
              # No coursework needs more than a handful of cores, and an
              # unbounded job on a 128-core box mostly converts cores into
              # concurrent allocations -- which is how a single `pip install`
              # of an unwheeled package reached the memory limit and was
              # SIGKILLed (exit 137). Paired with the *_NUM_THREADS env above.
              cpu: "4"
          securityContext:
            # 1000 = `jovyan`, the user rocker/ml is actually built around: it
            # owns /opt/venv and /home/jovyan. This was 1001 for a while, to
            # match the uid the runner container used when it created _work
            # (mounted here at /__w) -- the job MUST match whoever owns that
            # volume or it dies at the first action with
            #   EACCES: permission denied, open '/__w/_temp/_runner_file_commands/...'
            #
            # That matched the volume but broke the image: at 1001 the job could
            # not write /opt/venv, so `pip install -r requirements.txt` failed
            # with EACCES on site-packages for any package not already baked in.
            # The fix is to move the RUNNER to 1000 as well (see
            # cirrus-espm157-values.yaml) so both ends agree on the uid that
            # the image already uses. Changing this alone will break /__w.
            #
            # Still not root: the efi template uses runAsUser 0, but nothing in
            # the coursework needs it and this runner executes student-authored
            # code.
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            privileged: false
