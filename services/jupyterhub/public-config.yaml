# This file can update the JupyterHub Helm chart's default configuration values.
#
# For reference see the configuration reference and default values, but make
# sure to refer to the Helm chart version of interest to you!
#
# Introduction to YAML:     https://www.youtube.com/watch?v=cdLNKUoMc6c
# Chart config reference:   https://zero-to-jupyterhub.readthedocs.io/en/stable/resources/reference.html
# Chart default values:     https://github.com/jupyterhub/zero-to-jupyterhub-k8s/blob/HEAD/jupyterhub/values.yaml
# Available chart versions: https://hub.jupyter.org/helm-chart/
#
# NOTE: The singleuser.networkPolicy configuration below replaces the functionality
# of enable-external-access.sh and allows hairpin connections for JupyterHub pods
# to access external services like minio.carlboettiger.info and other cluster services.
#
# Reference existing docker-registry secret for private images
imagePullSecrets:
  - name: ghcr-pull-secret

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    kubernetes.io/ingress.class: traefik
  tls:
  - hosts:
    - jupyterhub.cirrus.carlboettiger.info
    secretName: jupyter-cirrus-tls
  hosts: 
  - "jupyterhub.cirrus.carlboettiger.info"
proxy:
  service:
    type: ClusterIP
cull:
  enabled: false
singleuser:
  allowPrivilegeEscalation: true
  image:
    pullPolicy: Always
  storage:
    type: dynamic
    extraLabels: {}
    # 30Gi, down from 100Gi. On juicefs-home this is applied as a per-directory
    # quota rather than a preallocation, so the old 100Gi never reserved
    # anything -- but it did set the ceiling a user could fill, and 100Gi per
    # head does not scale across a class. 30Gi is a realistic working set for a
    # notebook home; anyone who needs more can have their PVC expanded
    # (juicefs-home sets allowVolumeExpansion: true).
    #
    # NEW CLAIMS ONLY. Existing PVCs keep the size they were created with --
    # capacity is fixed at bind time and z2jh reuses a PVC that already exists,
    # so no current user's home changes or shrinks.
    capacity: 30Gi
    homeMountPath: /home/jovyan
    dynamic:
      # juicefs-home (RWX), not openebs-zfs (RWO, node-local to cirrus).
      #
      # A ZFS-LocalPV volume pins its pod to the node holding the pool, so an
      # openebs-zfs home can only ever run on cirrus. RWX on JuiceFS is what
      # lets a server land on either cirrus or thelio, and -- because there is
      # no volume to detach -- lets a server lost with thelio be restarted on
      # cirrus with nothing missing. juicefs-home deliberately omits the
      # `writeback` mount option that juicefs-sc uses; see
      # ../platform/juicefs/storageclass.yaml for why that matters for homes.
      #
      # NEW CLAIMS ONLY. The 21 existing homes stay on openebs-zfs and stay
      # pinned to cirrus: z2jh creates a PVC only when one does not already
      # exist, so changing this class never touches or migrates them. Existing
      # users keep local-disk performance; new users gain node mobility.
      storageClass:  juicefs-home
      pvcNameTemplate: claim-{escaped_user_server}
      volumeNameTemplate: volume-{escaped_user_server}
      storageAccessModes: [ReadWriteMany]
    extraVolumeMounts:
      - name: shm-volume
        mountPath: /dev/shm
    extraVolumes:
      - name: shm-volume
        emptyDir:
          medium: Memory
  networkPolicy:
    enabled: true
    egressAllowRules:
      # Enable access to private IP ranges (for MinIO and other cluster services)
      privateIPs: true
      # Keep DNS resolution working
      dnsPortsPrivateIPs: true
      dnsPortsKubeSystemNamespace: true
      # Allow internet access (excluding private ranges) - enables 'hairpin' connections
      nonPrivateIPs: true
    egress:
      # Specific access to your external IP (minio.carlboettiger.info at 128.32.85.8)
      - to:
          - ipBlock:
              cidr: 128.32.85.8/32
      # Allow access to MinIO namespace by label selector
      - to:
          - namespaceSelector:
              matchLabels:
                name: minio
  extraFiles:
    jupyter_server_config.json:
        mountPath: /usr/local/etc/jupyter/jupyter_server_config.json
        data:
          # Allow JupyterLab to show the 'View -> Show Hidden Files' option
          # in the menu. Defaults are not changed.
          # https://github.com/jupyterlab/jupyterlab/issues/11304#issuecomment-945466766
          ContentsManager:
            allow_hidden: true
          FileContentsManager:
            always_delete_dir: true
  profileList:
    - display_name: "Choose your environment and resources"
      default: true
      profile_options:
        image:
          display_name: Environment
          dynamic_image_building:
            enabled: True
          unlisted_choice:
            enabled: True
            display_name: "Custom image"
            display_name_in_choices: "Specify an existing docker image"
            description_in_choices: "Use a pre-existing docker image from a public docker registry"
            description: Specify your own docker image (must have python and jupyterhub installed in it)
            validation_regex: "^.+:.+$"
            validation_message: "Must be a publicly available docker image, of form <image-name>:<tag>"
            kubespawner_override:
              image: "{value}"
          choices:
            01-cpu:
              display_name: Default CPU environment
              description: General purpose python/R environment 
              kubespawner_override:
                image:  "ghcr.io/boettiger-lab/k8s:latest"
            02-gpu:
              display_name: RL GPU
              description: CUDA GPU environment, with RL
              kubespawner_override:
                image: "ghcr.io/boettiger-lab/k8s-gpu:latest"
                # Request a real, memory-capped GPU slice (MPS on cirrus).
                # Without this the pod sees all GPUs unmanaged via the nvidia
                # runtime, with no VRAM accounting/limit.
                extra_resource_limits:
                  nvidia.com/gpu: "1"
            03-gpu-spatial:
              display_name: GPU Spatial
              description: Rapids-AI GPU Spatial environment
              kubespawner_override:
                image: "ghcr.io/rocker-org/ml-spatial:latest"
                extra_resource_limits:
                  nvidia.com/gpu: "1"
        interface:
          display_name: Interface
          choices:
            lab:
              display_name: JupyterLab
              default: true
              kubespawner_override:
                default_url: /lab
            vscode:
              display_name: VS Code
              kubespawner_override:
                default_url: /vscode
            rstudio:
              display_name: RStudio
              kubespawner_override:
                default_url: /rstudio
        resource_allocation:
          display_name: Resource Allocation
          choices:
            mem_8:
              display_name: 8 GB RAM
              kubespawner_override:
                mem_guarantee: 8G
                mem_limit: 8G
              default: true
            mem_16:
              display_name: 16 GB RAM
              kubespawner_override:
                mem_guarantee: 16G
                mem_limit: 16G
            mem_32:
              display_name: 32 GB RAM
              kubespawner_override:
                mem_guarantee: 32G
                mem_limit: 32G 
            mem_64:
              display_name: 64 GB RAM (preemptable)
              kubespawner_override:
                mem_guarantee: 32G
                mem_limit: 64G 
            special:
              display_name: special use
              kubespawner_override:
                mem_guarantee: 32G
                mem_limit: 120G 

hub:
  allowNamedServers: true
  # Inject OAuth credentials and other secrets from K8s secret into environment
  # extraEnv uses dict format where key is env var name, value is valueFrom spec
  extraEnv:
    GITHUB_CLIENT_ID:
      valueFrom:
        secretKeyRef:
          name: jupyter-oauth-secret
          key: GITHUB_CLIENT_ID
    GITHUB_CLIENT_SECRET:
      valueFrom:
        secretKeyRef:
          name: jupyter-oauth-secret
          key: GITHUB_CLIENT_SECRET
    MINIO_KEY:
      valueFrom:
        secretKeyRef:
          name: jupyter-secrets
          key: MINIO_KEY
    MINIO_SECRET:
      valueFrom:
        secretKeyRef:
          name: jupyter-secrets
          key: MINIO_SECRET
    AWS_ACCESS_KEY_ID:
      valueFrom:
        secretKeyRef:
          name: jupyter-secrets
          key: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY:
      valueFrom:
        secretKeyRef:
          name: jupyter-secrets
          key: AWS_SECRET_ACCESS_KEY
    GHCR_USERNAME:
      valueFrom:
        secretKeyRef:
          name: jupyter-secrets
          key: GHCR_USERNAME
    GHCR_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: jupyter-secrets
          key: GHCR_PASSWORD
    OPENAI_API_KEY:
      valueFrom:
        secretKeyRef:
          name: jupyter-secrets
          key: OPENAI_API_KEY
  config:
    # Shared settings. we don't need nvidia to be default
    KubeSpawner:
      environment:
        SHELL: /usr/bin/bash
        GH_SCOPED_CREDS_CLIENT_ID: "Iv1.8d384d9612c2ecc3"
        GH_SCOPED_CREDS_APP_URL: "https://github.com/apps/jupyterhub-gh-creds"
        AWS_S3_ENDPOINT: "minio.carlboettiger.info"
        AWS_HTTPS: "true"
        AWS_VIRTUAL_HOSTING: "FALSE"
        GOOSE_PROVIDER: "github_copilot"
        OPENAI_BASE_URL: "https://ellm.nrp-nautilus.io/v1"
        # CPU math-library thread defaults. BLAS/OpenMP/PyTorch otherwise spawn one
        # thread per visible host core (128) PER PROCESS, so launching many workers
        # (a sweep, multiprocessing, sklearn n_jobs=-1) oversubscribes and thrashes
        # (context-switch + cache churn) — slow and antisocial on this shared node.
        # Default to 1 so threads == number of processes you launch: the common
        # "one worker per core" pattern is then automatically safe and can still
        # fill all 128 cores. Override per-job for a heavy SINGLE-process BLAS job
        # (e.g. `export OMP_NUM_THREADS=16` or `torch.set_num_threads(16)`).
        OMP_NUM_THREADS: "1"
        OPENBLAS_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
        NUMEXPR_NUM_THREADS: "1"
      extra_pod_config:
        runtimeClassName: "nvidia"
    Authenticator:
      admin_users:
        - cboettig 
    GitHubOAuthenticator:
      allowed_organizations:
        - boettiger-lab:current-members
        - boettiger-lab
        - SchmidtDSE
      scope:
        - read:org
      oauth_callback_url: https://jupyterhub.cirrus.carlboettiger.info/hub/oauth_callback
    JupyterHub:
      authenticator_class: github
  services:
    binder:
      url: http://binderhub
  image:
    name: quay.io/yuvipanda/z2jh-hub-with-fancy-profiles
    tag: z2jh-v4.0.0-fancy-profiles-sha-f80b661      
  extraConfig:
    enable-fancy-profiles: |
      from jupyterhub_fancy_profiles import setup_ui
      setup_ui(c)
    # Read OAuth credentials from environment variables (set via extraEnv from K8s secret)
    configure-oauth-from-env: |
      import os
      c.GitHubOAuthenticator.client_id = os.environ.get('GITHUB_CLIENT_ID')
      c.GitHubOAuthenticator.client_secret = os.environ.get('GITHUB_CLIENT_SECRET')
    # Pass secrets to singleuser pods via environment variables
    configure-singleuser-secrets: |
      import os
      c.KubeSpawner.environment.update({
          'MINIO_KEY': os.environ.get('MINIO_KEY'),
          'MINIO_SECRET': os.environ.get('MINIO_SECRET'),
          'AWS_ACCESS_KEY_ID': os.environ.get('AWS_ACCESS_KEY_ID'),
          'AWS_SECRET_ACCESS_KEY': os.environ.get('AWS_SECRET_ACCESS_KEY'),
          'OPENAI_API_KEY': os.environ.get('OPENAI_API_KEY'),
      })
    # (removed) 10-juicefs-named-servers
    #
    # This hook routed NAMED servers to juicefs-sc as a pilot, back when the
    # hub-wide default was openebs-zfs. singleuser.storage.dynamic now defaults
    # every NEW claim -- named or default -- to juicefs-home, so the hook is
    # redundant. It is deleted rather than left in place because it actively
    # disagreed with that default: juicefs-sc carries the `writeback` mount
    # option and juicefs-home deliberately does not, so keeping the hook would
    # have quietly given named servers the one storage class whose async
    # uploads can lose a user's work if the node dies -- on named servers,
    # which are precisely the ones expected to run on thelio.
    #
    # Existing named-server PVCs already bound to juicefs-sc are unaffected;
    # storageClass is immutable and z2jh reuses a PVC that already exists.


