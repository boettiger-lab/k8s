# Installed by freeze-hardening.sh
# Convert a detected hard lockup into a panic so it reboots and leaves a trace,
# rather than hanging silently forever.
kernel.hardlockup_panic = 1
# Reboot 10s after a panic (already the default here; pinned for clarity).
kernel.panic = 10
kernel.panic_on_oops = 1
# NOT enabled on purpose -- can false-positive under heavy ZFS/k3s I/O:
# kernel.softlockup_panic = 1
