# Companion to 60-lockup-capture.conf.
#
# That file catches HARD LOCKUPS (a CPU wedged with interrupts disabled).
# The 2026-08-24 incident was not a hard lockup -- it was HUNG TASKS: juicefs
# blocked in uninterruptible D state past 122s, 245s and 368s while every CPU
# stayed perfectly healthy. hardlockup_panic cannot see that, which is why the
# node sat wedged for six hours and never panicked. This closes that gap.

# A task still blocked after five minutes is not coming back on its own.
# Deliberately well above the 120s default, for the same reason
# 60-lockup-capture.conf leaves softlockup_panic off: a merely slow
# metadata/object backend must not cycle the node.
kernel.hung_task_timeout_secs = 300
kernel.hung_task_panic = 1

# Overrides 10-magic-sysrq.conf's 176. That value already permitted
# sync / remount-ro / reboot; bit 8 adds the debugging dumps, so Alt+SysRq+W
# prints every blocked task to the console -- the one command that names what
# is stuck when userspace is gone and SSH is dead.
kernel.sysrq = 1
